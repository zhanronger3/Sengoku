const HELP=`<h3>遊戲指南</h3><p>以日本戰國為背景的多人城池經營遊戲。從一座只有空地的小城開始，發展經濟、練兵出征、提拔武將，最後開分城擴張版圖。</p>
<h4 class="sh">時間</h4><ul><li>線上模式的時間流速是 ×${SPEED}(單機模式可在「遊戲設定」調整)。畫面上的施工、訓練、行軍倒數都是遊戲時間;來襲警報與盟軍增援的倒數是現實時間。</li><li>新手保護:開城後 ${PROTECT_DAYS} 個現實日內不會被其他玩家攻擊。每日任務在台灣時間 00:00 換日。</li><li>離線時資源照常生產,施工、訓練、行軍照常進行。</li></ul>
<h4 class="sh">資源與建築</h4><ul><li>城外 18 塊資源田產出木材、泥土、鐵塊、糧食;城內 ${NSLOTS} 塊空地自己決定蓋什麼,城牆不佔建地。</li><li>藏屋敷存放木材、泥土、鐵塊,米藏存放糧食(最高 20 級,容量 10 萬)。藏屋敷、米藏、埋藏所升到滿級後可以再蓋一座,效果相加;其他建築每座城只能一座。</li><li>知行所每級縮短施工時間 2.5%,最多 50%;3 級後可以拆除建築。只有織田家能城外、城內同時施工。</li><li>建築人口與軍隊都要吃糧(含出征中、駐守營寨的兵)。資源列最後一項是「耗糧 / 糧食總產量」;糧食耗盡時士兵會逃亡。</li></ul>
<h4 class="sh">軍事</h4><ul><li>足輕營訓練步兵、馬廻組訓練騎兵、鍛冶場製造攻城器械,每座最多排 10 批。更強的兵種要先升兵學塾。</li><li>軍奉行出兵。攻方總攻擊大於守方總防禦就贏,兵力優勢越大損失越少;輸了全軍覆沒。行軍速度取決於最慢的兵種。</li><li>防守方用步防或騎防,依攻方騎兵比例計算。城牆按百分比提高守軍防禦(木柵最高 70%、土壘漆壁 60%、石垣 50%)。</li><li>埋藏所藏起的資源搶不走(豐臣家兩倍;德川家出兵時對方埋藏所只有 2/3 效果)。</li><li>刀鍛冶所、具足屋每級讓全軍攻擊、防禦 +1.5%。破門槌拆城牆;大筒類器械轟建築,軍奉行 10/20 級可指定 1/2 處目標。</li><li>部隊抵達時才開戰,對方會先收到來襲警報;戰報用飛鴿傳書寄給雙方。抵達前可以撤回。</li></ul>
<h4 class="sh">武將、營寨、名物</h4><ul><li>評定眾可把一名士兵提拔為武將(費用為兵種成本 20 倍),每級 5 點屬性點,最高 20 級。武將戰敗會陣亡,可到評定眾復活。</li><li>地圖上的營寨全服共用,被打過約 12 遊戲小時後重新集結。評定眾 10/15/20 級可佔領 1/2/3 座(在城池 15×15 範圍內、武將領軍全滅守軍),每座讓這座城每種資源產量 +1%~+6%。</li><li>武將領軍全滅營寨守軍有 40% 機會帶回名物;藏寶閣每 10 級收藏 1 件。</li><li>在地圖 (4|1) 的菩提山城行三顧之禮,可以請出竹中半兵衛,全資源產量 +15%。</li></ul>
<h4 class="sh">擴張與交流</h4><ul><li>本丸御殿 10/15/20 級各有 1/2/3 個擴張名額(分城的二之丸御殿 10/20 級 1/2 個)。派 3 名開墾代官到空地開分城,出發的城威望要達到 14000/28000/42000;或用行政官讓別人分城的忠誠度歸零來佔領(主城無法被佔領)。</li><li>分城的金幣與任務由主城管理;左側「城池清單」或標題旁的選單可切換城池。</li><li>樂市樂座的商人可運送資源、在市場掛單;奏者番 1 級可加入聯盟、3 級可建立聯盟;軍奉行的「增援駐防」可派兵守盟友或自己的城(同一座城派去的會合併,派出者可自填人數部分召回或只召回武將)。商隊在地圖上以黑色虛線與箭頭顯示。城池可在城池清單「✎改名」。</li><li>商城:1 金幣買 ${GOLD_RATE} 單位資源,或花 ${EXCHANGE_COST} 金幣把資源依比例平倉。主城每遊戲小時 +1 金幣。</li></ul>

const mergeG=(list,kf)=>{const m=new Map();for(const e of list){const k=kf(e);if(!m.has(k))m.set(k,{...e,u:(e.u||[]).slice(),gids:[e.gid],hs:e.h?[e.h]:[]});else{const g=m.get(k),n=Math.max(g.u.length,(e.u||[]).length);g.u=Array.from({length:n},(_,i)=>(+g.u[i]||0)+(+(e.u||[])[i]||0));g.gids.push(e.gid);if(e.h)g.hs.push(e.h)}}return [...m.values()]},

 if(S.out&&S.out.length){const og=outG();h+=`<div class="army"><div class="ah">我派去駐防的部隊<br><span>${og.length} 處 · 共計 ${S.out.reduce((p,o)=>p+sumA(o.u),0).toLocaleString('en-US')}</span></div><table class="tb"><tr><th>駐防在</th><th>兵力</th><th></th></tr>`+og.map((o,i)=>`<tr><td>${esc(o.name)}</td><td><b>${sumA(o.u)}</b> 人<br><small class="mut">${ufs(S.fac,o.u)}</small>${o.hs.map(x=>`<br><small>⭐ 武將「${esc(x.n)}」駐防中(防禦 +${x.d})</small>`).join('')}</td><td><button data-a="garrx" data-i="${i}">召回</button></td></tr>`).join('')+'</table></div>'}

function garrGo(i,all){const o=outG()[i];if(!o)return;const want=o.u.map(()=>0);
 if(all)o.u.forEach((n,k)=>want[k]=n);else document.querySelectorAll('#modal .gt').forEach(e=>{const k=+e.dataset.k;want[k]=Math.max(0,Math.min(o.u[k]|0,Math.floor(+e.value)||0))});

  const before=CHD.pub.length+CHD.priv.length+((CHD.ally||[]).length);CHD.pub=mg(CHD.pub,j.pub);CHD.priv=mg(CHD.priv,j.priv).slice(-50);CHD.hasAlly=j.hasAlly;if(j.ally)CHD.ally=mg(CHD.ally||[],j.ally);if(!j.hasAlly)CHD.ally=[];
  CHS=[(CHD.pub.slice(-1)[0]||{t:0}).t,((CHD.ally||[]).slice(-1)[0]||{t:0}).t,(CHD.priv.slice(-1)[0]||{t:0}).t];
  if(CHD.pub.length+CHD.priv.length+((CHD.ally||[]).length)!==before||j.hasAlly!==undefined)dirty=1}catch(e){}}

const FAQ=[["新手保護期有多久？", "開城後 2 個現實日。這段期間其他玩家不能出兵攻擊你，但你可以掠奪營寨。保護期結束前，建議把埋藏所和城牆蓋好。"], ["遊戲時間跟現實時間怎麼換算？", "線上模式的遊戲時間是現實的 60 倍速。畫面上顯示 1 小時的施工或訓練，現實約 1 分鐘完成；遊戲 1 天約等於現實 24 分鐘。新手保護和每日任務換日則用現實時間計算。（單機模式可以在「遊戲設定」調整流速。）"], ["遊戲有背景音樂嗎？怎麼關掉？", "有。按「遊戲設定」可以開關背景音樂、調整音量。曲子依現實時間自動切換：06:00–18:00 放「出陣」，18:00–次日 06:00 放「城下町」，正在被敵軍攻擊的警示期間改放「祭」。瀏覽器規定要在你點一下畫面之後才能發聲，切到別的分頁會自動暫停。設定只存在這台裝置上。"], ["為什麼來襲警報的倒數跟建造倒數的速度不一樣？", "建造、訓練的倒數顯示遊戲時間，來襲警報與盟軍增援的倒數顯示現實時間，所以兩者走的速度不同。"], ["不上線時資源還會生產嗎？", "會。離線時資源照常生產，施工、訓練、行軍也照常進行，上線時一次結算。資源超過倉庫容量的部分不會保留。"], ["可以換勢力嗎？", "不行。勢力在開局時選定，之後無法更改。"], ["可以修改暱稱或密碼嗎？", "請到遊戲上方的「客服中心」提出申請。"], ["為什麼資源不再增加了？", "倉庫滿了。木材、泥土、鐵塊存在藏屋敷，糧食存在米藏，未建時容量只有 800，20 級時 10 萬。把藏屋敷或米藏升級，或在已有的升到 20 級後再蓋一座。"], ["怎麼加快施工？", "升級知行所，每級減少 2.5% 施工時間，20 級減少 50%。也可以用「普請」指令（織田家專屬）讓剩餘時間減半，或花 2 金幣立即完成一個項目。"], ["為什麼不能同時蓋兩樣東西？", "只有織田家可以城外、城內同時施工。德川家與豐臣家的資源田和建築共用一條施工佇列。"], ["建築可以拆掉嗎？", "知行所 3 級以上可以拆除，每次降 1 級，花費一半的建造時間，不退資源。知行所本身不能拆；拆藏屋敷或米藏前，現有資源要放得進拆除後的容量。"], ["取消施工會退資源嗎？", "會，取消施工中的項目全額退還。取消訓練也會退還尚未完成的士兵費用。"], ["耗糧是怎麼算的？", "耗糧 = 每座建築「等級 × 人口」＋ 每名士兵的耗糧。出征中、駐守營寨的兵照樣吃糧，駐防在你城裡的友軍也吃你的糧。畫面上方「🍚」那一格是「耗糧 / 糧食總產量」。"], ["糧食吃光會怎樣？", "糧食歸零且收支為負時，士兵會一個一個逃亡；家裡沒兵了，出征中的部隊也會開始逃亡。看到耗糧變紅，就該升農田、精米所，或減少軍隊。"], ["藏屋敷、米藏、埋藏所可以蓋好幾座嗎？", "可以。現有的一座升到滿級（藏屋敷、米藏 20 級，埋藏所 10 級）後，就能在空地再蓋一座，效果相加。其他建築每座城只能一座。"], ["怎麼提高產量？", "升資源田；蓋製材所、瓦窯、採礦精鍊所、精米所（每級 +5%，共 5 級）；用「勸農」+25%；拜訪菩提山城請出竹中半兵衛 +15%；收藏名物；佔領營寨。"], ["怎麼訓練士兵？", "蓋足輕營（步兵）或馬廻組（騎兵），輸入數量按「訓練」。每座兵營最多排 10 批。更強的兵種要先把兵學塾升到對應等級。"], ["兵學塾幾級解鎖哪些兵？", "1 級第二種兵；3 級第三種兵與偵察兵；5 級開墾代官；7 級第四種兵；10 級精銳騎兵與破門槌；15 級大筒類器械；20 級行政官。"], ["怎麼出兵？", "先蓋軍奉行。到「地圖」點目標，或在軍奉行輸入座標，選擇兵力後出發。行軍速度取決於隊伍中最慢的兵種，抵達時才結算戰鬥。"], ["戰鬥怎麼判定勝負？", "攻方總攻擊大於守方總防禦就贏。攻方損失比例是 (守方防禦 ÷ 攻方攻擊)^1.5，所以兵力優勢越大，損失越少。輸了的話攻方全軍覆沒。完整公式請看「遊戲說明 → 戰鬥規則」。"], ["步防和騎防有什麼差別？", "防守時用哪一種防禦，取決於攻方攻擊力中騎兵佔多少。對手全派騎兵，就用騎防計算；步騎各半，就各算一半。"], ["能搶走多少資源？", "存活士兵的總攜帶量平均分成四份，每種資源最多搶一份，而且搶不到對方埋藏所藏起來的量。資源要等部隊走回城才入庫。"], ["埋藏所怎麼保護資源？", "被攻擊時，每種資源低於埋藏量的部分不會被搶。1 級藏 300、10 級藏 3181，豐臣家兩倍；但德川家出兵時，對方埋藏所只有 2/3 效果。"], ["城牆有什麼用？", "按百分比提高守軍總防禦。20 級時木柵 +70%、土壘漆壁 +60%、石垣 +50%。木柵加成高但最容易被破門槌拆，石垣相反。"], ["怎麼拆對方城牆和建築？", "帶破門槌拆城牆，帶大筒、飛石機或焙烙火砲車轟建築。器械要戰鬥勝利且存活才有作用。軍奉行 10 級可以指定 1 處目標建築，20 級指定 2 處，否則隨機一處。"], ["出兵後可以反悔嗎？", "部隊抵達前可以撤回，已經走了多久，就要再花同樣的時間回來。"], ["被攻擊會事先知道嗎？", "會。敵軍出發後，畫面上方會出現紅色「來襲警報」，顯示來源與抵達倒數。戰報會用飛鴿傳書寄給雙方。"], ["怎麼得到武將？", "蓋評定眾，選一名在城裡的戰鬥兵提拔，費用是該兵種成本的 20 倍。每座城 1 名武將；主城的武將是你的家主。"], ["武將怎麼升級？", "帶兵打贏就有經驗，每場得「守方防禦 ÷ 20」，最少 5、最多 400。升級需要「等級 × 60」經驗，最高 20 級，每級 5 點屬性點可以分配到攻擊、防禦、速度、攜帶。"], ["武將陣亡了怎麼辦？", "到評定眾復活，費用是每種資源 400 × 武將等級。攻擊玩家或營寨失敗時武將會陣亡。"], ["怎麼取得名物？", "武將領軍全滅營寨守軍時，有 40% 機會找到名物。需要藏寶閣（知行所 10 級解鎖），每 10 級可放 1 件；同一件不能重複持有。也能用攻城器械砸低對方藏寶閣，搶走放不下的名物。"], ["名物有哪些效果？", "巨木旗、黃金茶釜、鐵砲傳來書、豐年之鍬分別讓木材、泥土、鐵塊、糧食產量 +25%；天下布武印全資源 +10%；千鳥十文字槍全軍攻擊 +10%；南蠻胴具足全軍防禦 +10%。"], ["怎麼佔領營寨？", "評定眾 10／15／20 級各有 1／2／3 個佔領名額。營寨要在出兵城池 15×15 範圍內，由武將領軍全滅守軍，存活的兵會留下駐守。每佔領一座，這座城每種資源產量 +1%～+6%（依階級）。"], ["佔領的營寨會被搶走嗎？", "會。營寨全服共用，其他玩家打贏你的駐軍就能搶走。駐軍越多越安全；「召回」只撤兵，「放棄」才讓營寨變回無主。"], ["怎麼開分城？", "本丸御殿 10 級有 1 個擴張名額（15、20 級再各加 1），這座城威望要達到 14000（第 2、3 座要 28000、42000）。訓練 3 名開墾代官，派到地圖空地即可建城。"], ["分城可以蓋本丸御殿嗎？", "不行。本丸御殿整個帳號只有一座，蓋在主城；分城請蓋二之丸御殿，10 級 1 個擴張名額、20 級 2 個。"], ["分城的地點有差嗎？", "有。空地的地形決定分城資源田配置：森林多伐木場、泥坑多泥坑、礦坑多鐵礦場、平原多農田（9 塊）。"], ["可以佔領別人的城池嗎？", "只能佔領別人的分城，主城無法被佔領。派一般軍隊帶上行政官攻打並打贏，每名存活的行政官讓忠誠度下降 20～30。忠誠度歸零就易主，需要 1 個擴張名額。"], ["怎麼守住自己的分城？", "分城忠誠度每遊戲小時回復 1 點，上限 100。只要對方打不贏，行政官就無法降低忠誠度，所以守軍與城牆是關鍵；也可以請盟友派兵駐防。"], ["怎麼運送資源？", "蓋樂市樂座，每級 1 名商人。輸入對方座標與數量送出，商人速度 16 格／小時，往返期間不能再用。勘定所每級讓載運量 +10%。"], ["市場掛單怎麼用？", "在樂市樂座提供一種資源、換另一種資源，比例不能超過 1:3。別人接受後，雙方的商人會把資源送到。取消掛單會退回資源。"], ["怎麼加入或建立聯盟？", "奏者番 1 級可以接受邀請，3 級可以建立聯盟。想加入別人的聯盟，可以用飛鴿傳書寫信給盟主請他邀請你。聯盟人數上限是盟主奏者番等級的 2 倍，最少 6 人。"], ["盟友能幫我守城嗎？", "可以。在軍奉行選「增援駐防」，把一般戰鬥兵派到盟友的城。每座城最多接受 5 支駐防部隊，駐防兵吃所在城的糧。"], ["金幣怎麼來？", "主城每遊戲小時自動 +1 金幣（線上模式約每現實分鐘 1 枚），完成主線任務和每日任務也有金幣。金幣全帳號共用，分城不產金幣。"], ["金幣可以做什麼？", "在商城用 1 金幣買 200 單位資源；花 1 金幣平倉，把資源依比例重新分配；或花 2 金幣讓一個施工項目立即完成。"], ["任務完成了為什麼沒拿到獎勵？", "任務獎勵要到「任務」頁手動領取。主線任務與每日任務的獎勵都存進主城，在分城無法領取。"], ["竹中半兵衛怎麼請？", "到地圖座標 (4|1) 的菩提山城拜訪 3 次，依序送上每種資源 300、600、900。第三次他就會出仕，全資源產量永久 +15%。"], ["城池可以改名嗎？", "可以。到「城池清單」，每座城旁邊有「✎改名」，主城、分城都能改。名稱 2～8 個字（中文、日文、英文、數字），每座城 24 現實小時只能改一次；不能含不雅字詞、不能跟其他玩家的暱稱相同或太像，而且全服用過的名稱不能再用（包含你自己改掉的舊名）。改名需要登入。"], ["派出去駐防的部隊怎麼召回？", "到軍奉行，「我派去駐防的部隊」是一張卡片：同一座城派出去的幾批兵會合併成一支。按「召回」可以輸入每個兵種要召回的人數，或按「全部」；也可以只勾選「召回武將」讓武將單獨回家，兵留在原地。兵走回來需要時間。「駐防在這座城的友軍」是另一張卡片，按「請他們回去」會讓那支友軍整支返回。"], ["不同城池的武將會重名嗎？", "不會。同一個帳號各城抽到的武將名字不重複。舊存檔如果已經重複，登入時系統會自動幫後來的那座城換成沒用過的名字，等級、經驗、屬性點都不變，並寄一封「武將名單調整」系統信通知。"], ["地圖上的黑色虛線和箭頭是什麼？", "那是商隊。虛線連接出發的城和目的地，箭頭沿線移動：去程朝目的地、回程朝家，旁邊的倒數是現實時間。全服玩家的商隊都看得到，但看不到載運的內容。"], ["城外畫面上的小燈是什麼？", "那是建築指示燈，亮燈代表該建築正在忙（訓練中、研究中、商隊在外等）。點燈會直接跳到對應建築；「在城」的兵點文字會到軍奉行，需要先蓋好該建築。"],["遊戲有背景音樂嗎？怎麼關掉？", "有。按「遊戲設定」可以開關背景音樂、調整音量。曲子依現實時間自動切換：06:00–18:00 放「出陣」，18:00–次日 06:00 放「城下町」，被敵軍攻擊的警示期間改放「祭」。瀏覽器規定要先點一下畫面才能發聲，切到別的分頁會自動暫停。設定只存在這台裝置上。"]];

function gachaTable(){const C=G.getGachaCfg(),tot=C.prizes.reduce((a,o)=>a+o.p,0);return `<table class="mut" style="margin:6px 0"><tr><th align="left">獎品</th><th align="left">內容</th><th>機率</th></tr>${C.prizes.map(o=>`<tr><td>${esc(o.n)}</td><td>${o.t==='pack'?'四種資源各 '+o.v:'訓練縮短 '+o.v+' 小時'}</td><td align="center">${Math.round(o.p/tot*1000)/10}%</td></tr>`).join('')}</table>`}

 else if(d.a=='gon'){GOFF=false;try{localStorage.removeItem(KEY+'_goff')}catch(e){}dirty=1}
 else if(d.a=='udesc'){UOPEN=UOPEN===+d.k?null:+d.k;dirty=1}
 else if(d.a=='tile'){sel=[+d.x,+d.y];TGT=sel;dirty=1}
 else if(d.a=='cnedit'){if(!ME)return toast('改城名需要先登入(城名全服不能重複,要由伺服器確認)');const kk=d.k,c=(CITIES||[]).find(z=>z.k==kk),cur=c?(c.col||c.cs?c.n:''):(S&&S.cname)||'';modal(`<h3>改城名</h3><p class="mut">2 到 8 個字(中文、日文假名、英數字)。每座城 24 小時只能改一次;不能含髒話、不能冒用其他玩家的暱稱;全服用過的名字(包含你自己以前用過的)都不能再用。</p><p><input id="cnin" maxlength="12" value="${esc(cur)}" placeholder="新城名" style="width:100%;box-sizing:border-box"></p><p id="cnmsg" class="mut"></p><p><button data-a="cnok" data-k="${esc(kk)}">確定改名</button></p>`);setTimeout(()=>{const e=$('#cnin');if(e){e.focus();e.select()}},50)}
 else if(d.a=='cnok'){const v=($('#cnin').value||'').trim(),m=$('#cnmsg');if(!v){m.textContent='請輸入城名';return}m.textContent='處理中…';const kk=d.k;(async()=>{try{await drain();const r=await apiAuth('/api/act',{action:{t:'cnamep',name:v},c:kk},'POST');const j=r.j||{};if(r.ok){$('#modal').style.display='none';toast(j.msg||'已改名');await pull(true);dirty=1;render()}else m.textContent=j.msg||('失敗('+r.s+')')}catch(e){m.textContent='連線失敗,請稍後再試'}})()}
 else if(d.a=='wild'){const ns=(d.n||'').split(',').filter(n=>WILDIMG[n]);if(ns.length)modal(`<h3>野外勢力</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px">`+ns.map(n=>`<img src="assets/wf_${WILDIMG[n]}.webp" alt="${n}" loading="lazy" style="width:100%;height:auto;border-radius:8px;display:block;aspect-ratio:260/460">`).join('')+`</div>`)}
 else if(d.a=='bgo'){const sl=slotOf(d.b),bb=B.find(z=>z.id==d.b);if(sl<0){toast('需要先建造'+(bb?bb.n:'這個建築'));return}bs=sl;view='b';dirty=1}
 else if(d.a=='tgo'){const sl=slotOf('war');if(sl<0){toast('需要先建造軍奉行');return}bs=sl;view='b';dirty=1}
 else if(d.a=='mp'){mc=[mc[0]+ +d.dx,mc[1]+ +d.dy];dirty=1}
 else if(d.a=='mgo'){mc=[Math.floor(+$('#mx').value||0),Math.floor(+$('#my').value||0)];dirty=1}
 else if(d.a=='sall'){const e=$('#s'+d.k);if(e){e.value=e.max;fvSave({target:e})}}
 else if(d.a=='mhome'){mc=[home().x,home().y];dirty=1}
 else if(d.a=='buy')doA({t:'buy',res:SH.res,gold:Math.floor(+$('#bgd').value||0)});
 else if(d.a=='bal')doA({t:'balance',r:[0,1,2,3].map(i=>Math.floor(+$('#r'+i).value||0))});
 else if(d.a=='balp'){SH.r=d.p.split(',').map(Number);dirty=1}
 else if(d.a=='rk'){rp=+d.p;dirty=1}
 else if(d.a=='rks'){const a=rkRows().rows,n=Math.floor(+$('#rkn').value||0),q=($('#rkm').value||'').trim();let i=n>0?n-1:q?a.findIndex(r=>r.t.includes(q)):-1;if(i<0||i>=a.length)return toast('找不到');rp=Math.floor(i/20);dirty=1}
 else if(d.a=='rkgo'){const x=Math.floor(+d.x),y=Math.floor(+d.y);if(!Number.isFinite(x)||!Number.isFinite(y))return;mc=[x,y];sel=[x,y];view='map';dirty=1;loadWorld()}
 else if(d.a=='rkt'){rkt=+d.i;rp=0;dirty=1}
 else if(d.a=='mt'){mt=d.t;mo=null;dirty=1;if(mt=='in'||mt=='out')loadMail()}
 else if(d.a=='mread'){mt='read';mo={box:d.box,id:d.id};dirty=1;if(d.box=='in'){const m=MAIL.inbox.find(x=>x.id==d.id);if(m&&!m.r){m.r=true;MAIL.unread=Math.max(0,MAIL.unread-1);api('/api/mail',{t:'read',id:d.id}).catch(()=>{})}}}
 else if(d.a=='mreply'){const m=mfind();if(m&&!m.sys){CMP={x:String(m.from.x),y:String(m.from.y),s:/^Re:/.test(m.s)?m.s:'Re: '+m.s,b:''};mt='new';mo=null;dirty=1}}
 else if(d.a=='mdel'){const m=mfind();if(m){const box=m.box;(async()=>{try{await api('/api/mail',{t:'del',box:box=='in'?'inbox':'sent',id:m.id});}catch(e){}await loadMail();mt=box;mo=null;dirty=1;render()})()}}
 else if(d.a=='mailto'){CMP={x:String(d.x),y:String(d.y),s:'',b:''};view='mail';mt='new';mo=null;dirty=1}
 else if(d.a=='msend'){const x=Math.floor(+$('#mlx').value),y=Math.floor(+$('#mly').value),sj=$('#mls').value,bd=$('#mlb').value;CMP={x:String(x),y:String(y),s:sj,b:bd};
  if(!bd.trim())return toast('信件內容不能是空的');
  (async()=>{try{const r=await api('/api/mail',{t:'send',tx:x,ty:y,s:sj,b:bd});if(r.ok){toast((r.j&&r.j.msg)||'已寄出');CMP={x:'',y:'',s:'',b:''};mt='out';await loadMail()}else toast((r.j&&r.j.msg)||'寄信失敗');}catch(e){toast('寄信失敗,請稍後再試')}dirty=1;render()})()}
 else if(d.a=='ct'){ct=+d.i;dirty=1}
 else if(d.a=='chsend')chatSend();
 else if(d.a=='chto'){ct=2;dirty=1;render();const e=$('#cht');if(e){e.value=d.n;FV.cht=d.n;const m=$('#chm');if(m)m.focus()}}
 else if(d.a=='fbsend')fbSend();else if(d.a=='quizans')quizAnswer(+d.i);
 if(view=='map'&&['nav','mp','mgo','mhome'].includes(d.a))loadWorld();
 if(view=='rank'&&d.a=='nav')loadRank();
 if(dirty)render()}

async function start(){KEY='sg_village_v3'+(ME?'_'+ME.id:'');try{GOFF=localStorage.getItem(KEY+'_goff')==='1'}catch(e){}
 if(ME){NICK=ME.nick||'主公';speed=SPEED;const t0=Date.now();
  try{const r=await api('/api/save');if(r.ok&&r.j){noteSrv(r.j);if(r.j.c)CUR=r.j.c;REV=r.j.rev||0;if(r.j.state){adopt(r.j.state,t0);setCloud('已載入雲端進度')}}else setCloud('同步失敗')}catch(e){setCloud('離線')}
  if(S){drawRes();render();pollMail()}else pick();return}
 if(load()){drawRes();render()}else pick()}

async function boot(){let note='';
 if(/confirmation_token|recovery_token|invite_token|access_token|error=/.test(location.hash)&&window.handleAuthCallback){
  try{const res=await window.handleAuthCallback();if(res)note='信箱驗證完成'}catch(e){note='驗證失敗:'+(e&&e.message||e)}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
 }
 let r=null;try{r=await api('/api/me')}catch(e){}
 if(r&&r.s==200&&r.j&&r.j.id){ME=r.j;$('#who').textContent=ME.email;start()}
 else if(r&&r.s==401)authUI(false,note?note+',請登入':'')
 else start()}

// 輸入欄暫存:畫面每次重繪都會重建欄位,所以把使用者填的值記下來,重繪後補回去
const FV={},FVX=new Set(['csw','spd','brs','bgd']),FVCLR=new Set(['nav','fld','bld','mp','mgo','mhome','raid','ship','offer','tr','b','f','hero','heropt','herorev']);
const fvSave=e=>{const t=e.target,id=t&&t.id;if(!id||FVX.has(id)||!/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))return;FV[id]=t.type=='checkbox'?t.checked:t.value};
const fvRestore=()=>{for(const id in FV){const el=document.getElementById(id);if(!el||el===document.activeElement)continue;if(el.type=='checkbox')el.checked=!!FV[id];else if(el.tagName!='SELECT'||[...el.options].some(o=>o.value==FV[id]))el.value=FV[id]}};
document.addEventListener('input',fvSave,true);document.addEventListener('change',fvSave,true);
document.addEventListener('input',e=>{if(e.target&&e.target.id==='bgmv')BGM.setVol(+e.target.value)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){if(FVCLR.has(b.dataset.a))for(const k in FV)delete FV[k];act(b.dataset)}});
document.addEventListener('change',e=>{if(e.target.id=='csw')goCity(e.target.value);if(e.target.id=='spd'){speed=+e.target.value;if(S&&!ME)save()}if(e.target.id=='brs')SH.res=+e.target.value});
document.addEventListener('input',e=>{const id=e.target.id;if(/^n\d+$/.test(id))TRV[+id.slice(1)]=Math.max(1,Math.floor(+e.target.value||1));else if(/^s\d+$/.test(id))SENDV[+id.slice(1)]=Math.max(0,Math.floor(+e.target.value||0));else if(id=='bgd')SH.gold=Math.max(1,Math.floor(+e.target.value||1));else if(id=='mlx')CMP.x=e.target.value;else if(id=='mly')CMP.y=e.target.value;else if(id=='mls')CMP.s=e.target.value;else if(id=='mlb')CMP.b=e.target.value;else if(/^r[0-3]$/.test(id)){SH.r[+id[1]]=Math.max(0,Math.floor(+e.target.value||0));updBal()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.d)op[d.dataset.d]=d.open},true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'){flush();pull()}});
addEventListener('online',()=>{flush();pull(true)});
const busy=()=>['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
setInterval(()=>{if(!S)return;const n=Date.now(),dt=(n-last)/1000*speed;last=n;G.adv(dt,{quiet:dt/speed>300});G.setNow(Date.now()+CLK);G.dailyRoll();
 const sg=(S.log[0]?S.log[0].t+S.log[0].m:'')+S.u.join(',')+JSON.stringify(S.q)+JSON.stringify(S.tr);if(sg!==sig){sig=sg;dirty=1}
 drawRes();updCd();if(view=='map'){const e=document.getElementById('mvl');if(e)e.innerHTML=mvSvg()}
 if(ME&&Date.now()-lastRes>8000){const nowS=Date.now()+CLK;if(INC.some(e=>e.arrAt<=nowS)||S.mv.some(m=>m.pending&&m.sentAt&&nowS>=m.sentAt+m.dur/SPEED*1000)){lastRes=Date.now();pull(true)}}
 if(dirty&&!busy())render()},250);
setInterval(()=>{if(S){if(!ME)save();if(!busy())render()}},4000);
setInterval(()=>{if(ME)chatPoll()},8000);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chm'){e.preventDefault();chatSend()}});
setTimeout(()=>{if(ME)chatPoll()},3000);
setInterval(()=>{if(ME&&S){flush();pollMail();pull();if(view=='map')loadWorld()}},60000);
setInterval(()=>{if(ME&&S&&OUT.length&&!flushing&&!AUTHLOST)flush()},8000);
setInterval(()=>{if(ME&&S&&!document.hidden&&(view=='in'||view=='out')&&!OUT.length&&!flushing&&!AUTHLOST)pull()},10000); // 建築/資源田頁:每 10 秒向伺服器對一次(建築相關狀態)
addEventListener('beforeunload',e=>{if(S&&!ME)save();if(ME&&(OUT.length||flushing)){e.preventDefault();e.returnValue=''}});

boot();
