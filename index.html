function syncMc(){const h=home(),pk=h.x+','+h.y;if(pk!==curPos){curPos=pk;mc=[h.x,h.y]}}
function nearestCamp(){const h=home();let best=null,bd=1e9;for(let r=0;r<=14;r++)for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const x=h.x+dx,y=h.y+dy,n=npcAt(x,y);if(n&&!n.zg){const d=Math.hypot(dx,dy);if(d<bd){bd=d;best=[x,y]}}}return best||[h.x+1,h.y+1]}
async function loadWorld(){if(!ME||!S)return;const [cx,cy]=mc;try{const r=await api('/api/world?x0='+(cx-6)+'&y0='+(cy-6)+'&x1='+(cx+6)+'&y1='+(cy+6));
 if(r.ok&&r.j&&r.j.villages){for(const k of [...VIL.keys()]){const [x,y]=k.split(',').map(Number);if(x>=cx-6&&x<=cx+6&&y>=cy-6&&y<=cy+6)VIL.delete(k)}r.j.villages.forEach(v=>VIL.set(v.x+','+v.y,v));dirty=1}}catch(e){}}

function save(){try{S.saved=Date.now();S.spd=speed;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(!s)return false;S=G.fix(JSON.parse(s));speed=S.spd||SPEED;const real=Math.min((Date.now()-S.saved)/1000,24*3600);if(real>0)G.adv(real*speed,{quiet:real>300});syncMc();return true}catch(e){return false}}

const HELP='<h3>遊戲指南</h3><p>這是依據原作復刻日本戰國時期的多人遊戲。</p><ul><li>資源田(外城)產出木材、泥土、鐵塊、糧食。內城有 21 塊空地,自己決定要蓋什麼;城牆環繞城內建地,不佔建地。</li><li>知行所每個城池只能一座;藏屋敷、米藏、埋藏所在現有的升到滿級後可以再蓋新的,效果加總。</li><li>知行所等級越高,所有施工越快(最多省 50%)。只有織田家能外城內城同時施工。</li><li>藏屋敷、米藏最高 20 級,容量 10 萬。</li><li>足輕營、馬廻組可以連續排隊訓練(最多 10 批),每批依序完成。</li><li>建築人口與軍隊都要吃糧;右上角資源列最後一項是「耗糧 / 糧食總產量」。</li><li>「埋藏所」可以藏起資源,避免被其他玩家搶走。城牆環繞城內建地,提高守軍防禦(織田家木柵、德川家石垣、豐臣家土壘漆壁)。</li><li>出征中的兵一樣要吃糧;糧食耗盡時,出征中的兵也會逃亡。</li><li>兵營訓練士兵;軍奉行出兵掠奪地圖上的據點。行軍速度取決於隊伍中最慢的兵種。</li><li>刀鍛冶所、具足屋每級加成兵種攻防 1.5%。</li><li>在地圖上的菩提山城行三顧之禮,可以請出竹中半兵衛。</li><li>商城:用金幣買資源,或把現有資源依比例平倉。</li><li>本丸御殿 10/15/20 級各有 1/2/3 個擴張名額:派 3 名開墾代官到空地可開分城,或用行政官讓別人分城的忠誠度歸零來佔領(本丸無法被佔領)。左側「城池清單」或標題旁的選單可切換城池;分城的金幣與任務由本丸管理。</li><li>可以出兵掠奪其他玩家的城池(對方在新手保護期內不行)。部隊抵達時才開戰,對方會先收到來襲警報;戰況以戰報用飛鴿傳書寄給雙方。</li></ul><p class="mut">尚未實作:綠洲、增援。</p>';

const FAQ=[["不上線時資源是否依然生產？","是，離線狀況下各資源（木材、泥土、鐵塊、糧食）依然照生產速率持續產出。"],["下線後在建的建築是否持續？","是，離線前排入建造或研究佇列的任務會持續進行直到完成，速度不變。"],["如何提升建築、拆除與研究速度？","升級「知行所」，最高 20 級可縮短 50% 建造時間。3級可解鎖城內建築拆除功能（每次拆除 1 級）。"],["如何增加資源容量？","升級「藏屋敷」與「米藏」，最高 20 級（單個容量 10 萬），超出的話可於 20 級後加建新倉庫或米藏。"],["是否可以修改暱稱與密碼？","暱稱及密碼可透過「客服中心」進行重設。"],["如何攻打別人？","進入「軍奉行」點擊出兵，輸入座標或在地圖點擊目標。"],["如何在敵人來襲時隱藏資源？","建造「埋藏所」，1 級每種資源隱藏 300 單位，最高 10 級（可再加建新地窖）。【勢力特色】：豐臣家地窖容量 2 倍。"],["如何擁有自己的士兵？","建造足輕營或馬廻組訓練。高級兵種需先在「兵學塾」完成解鎖研究。"],["耗糧如何計算？","耗糧包含本村建築人口與軍隊，不包含被俘虜的敵方士兵。"],["如何運輸與交易資源？","透過「樂市樂座」進行運輸（建議直接輸入座標最可靠）或買賣交易。"],["如何加入或創建聯盟？","「奏者番」1 級可接受邀請入盟，3 級可建立自己的聯盟。建議可發信件向盟主或官員申請。"],["如何擁有自己的英雄？","在「評定眾」中可將已有士兵提拔為英雄，英雄升級後可分配 5 個屬性點。"],["如何提高士兵攻防素質？","防禦在「具足屋」升級，攻擊在「刀鍛冶所」升級。"],["城牆防禦加成如何計算？","木柵靈活多變但耐久低（最高 70%）；石垣耐久極高但加成低（最高 50%）；土壘漆壁均衡（最高 60%）。"],["如何開分城或佔領別人城池？","本丸御殿在 10、15、20 級可各開一分村；二之丸御殿在 10、20 級可開分村。開分村需要 3 個「開墾代官」。佔領他人城池需研究行政官，在對方無行宮時派行政官普通攻擊直至忠誠歸零。"],["如何增加文明度？","建造「禮儀所（禮部）」，10 級前小型活動（400文明度/次），10 級後大型活動（1600文明度/次）。"],["如何增加商人運輸量？","商人的基礎運載量：織田為 500、德川為 1000、豐臣為 750。建造「勘定所」每升 1 級運載量提高 10%（需樂市樂座 20 級後解鎖）。"],["如何佔領野外營寨？","評定眾達到 10、15、20 級時可在 3*3 範圍內由英雄帶領全滅野外營寨中立野外兵種來佔領。"],["如何擁有寶物（名物）？","在家中建造 10 級「藏寶閣」，由英雄帶領全滅中立兵或攻擊玩家（需砸毀對方藏寶閣）即可搶奪。寶物附帶各種加成（如巨木旗 +25%、聖靈珠 +50% 等）。"],["刀鍛冶所與具足屋攻防加成計算？","每升 1 級增加基礎值的 1.5%。例如攻擊等級 10 的鄉士足輕攻擊力 = 40 * (1 + 1.5% * 10) = 46。"]];

async function finish(){const r=await api('/api/me');if(r.ok&&r.j&&r.j.id){ME=r.j;AUTHLOST=false;$('#modal').style.display='none';$('#who').textContent=ME.email;await start();flush()}else authUI(false,'無法確認登入狀態')}
async function doLogout(){if(!ME)return toast('目前是訪客模式(沒有連上後端)');await drain();await api('/api/logout',{});location.reload()}

let REV=0,OUT=[],flushing=false,AUTHLOST=false;
const tnow=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const setCloud=t=>{const el=$('#cloud');el.textContent=t?' ☁ '+t:'';el.title=t?'點一下立即同步':''};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function adopt(st,t0){S=G.fix(st);speed=SPEED;const lag=(Date.now()-t0)/1000;if(lag>0)G.adv(lag*speed,{quiet:true});syncMc();dirty=1}
function relogin(){AUTHLOST=true;setCloud('登入已過期,請重新登入');authUI(false,'登入已過期(閒置太久了),請重新登入。你剛才的操作會在登入後自動補送。')}
// 帶自動續期的請求:401 時先打 /api/me(伺服器會換新登入),再試一次
async function apiAuth(p,b,m,k){let r=await api(p,b,m,k);if(r.s==401){await api('/api/me').catch(()=>{});r=await api(p,b,m,k)}return r}
function queueSend(a){OUT.push(a);setCloud('同步中…');flush()}
async function flush(){if(flushing||!ME||AUTHLOST)return;flushing=true;
 try{while(OUT.length){const a=OUT[0],r=await send(a);if(r==='again')continue;if(r==='retry'){setCloud('同步失敗,稍後自動重試');break}OUT.shift()}}finally{flushing=false}
 if(!OUT.length&&!AUTHLOST)setCloud('已同步 '+tnow())}
async function drain(){for(let i=0;i<40&&(OUT.length||flushing);i++){if(!flushing)flush();await sleep(250)}}
let again409=0;
async function send(a){const t0=Date.now();let r;
 try{r=await apiAuth('/api/act',{action:a,rev:REV,c:CUR||undefined},'POST',1)}catch(e){setCloud('離線,稍後重試');return'retry'}
 const j=r.j||{};
 if(r.s==401){relogin();return'retry'}
 if(r.s>=500||r.s==0)return'retry';
 noteSrv(j);
 if(r.s==403&&j.gone){toast(j.msg||'這座城池已不屬於你');CUR=null;REV=0;OUT.length=0;await pull(true);return'drop'}
 if(r.ok){again409=0;if(j.state&&j.rev!=null){REV=j.rev;if(OUT.length<=1&&(!j.c||!CUR||j.c==CUR))adopt(j.state,t0)}if(j.msg)toast(j.msg);return'ok'}
 if(r.s==409){if(j.rev!=null)REV=j.rev;if(++again409<=3){await sleep(100+Math.random()*300);return'again'}again409=0;await pull(true);return'drop'}
 if(j.state&&j.rev!=null){REV=j.rev;adopt(j.state,t0)}
 if(j.msg)toast(j.msg);return'drop'}
async function pull(force){if(!ME||AUTHLOST||((OUT.length||flushing)&&!force))return;const t0=Date.now();
 try{const r=await apiAuth('/api/save'+(CUR?'?c='+encodeURIComponent(CUR):''));if(r.s==401)return relogin();if(r.ok&&r.j){noteSrv(r.j);if(r.j.c)CUR=r.j.c;REV=r.j.rev||0;if(r.j.state){adopt(r.j.state,t0);if(!OUT.length)setCloud('已同步 '+tnow())}}}catch(e){setCloud('離線,稍後重試')}}

async function goCity(k){if(!ME||!S||!k||k===CUR)return;await drain();if(OUT.length||flushing){toast('還有操作正在同步,請稍後再切換');return}
 CUR=k;view='out';bv=null;bs=null;sel=null;TGT=null;VIL.clear();curPos='';await pull(true);syncMc();drawRes();dirty=1;render();toast('已切換到:'+(S.col?(S.cname||'分城'):'本丸'))}
function doA(a,after){const r=G.perform(a);if(!r.ok){toast(r.msg||'無法執行');return false}if(r.msg)toast(r.msg);if(after)after();dirty=1;if(ME)queueSend(a);else save();return true}
function newGame(f){setTimeout(()=>modal(WELCOME),50);S=G.init(f);if(ME)speed=SPEED;view='out';bv=null;curPos='';syncMc();sel=null;TGT=null;VIL.clear();$('#modal').style.display='none';dirty=1;if(ME)queueSend({t:'init',fac:f});else save();render()}
function act(d){
 if(d.a=='pick')return newGame(d.f);
 if(d.a=='close'){$('#modal').style.display='none';return}
 if(d.a=='authsw')return authUI(d.r=='1');
 if(d.a=='dolog')return doLogin();
 if(d.a=='dosign')return doSign();
 if(d.a=='logout')return doLogout();
 if(d.a=='syncnow'){if(!ME)return;if(AUTHLOST)return relogin();setCloud('同步中…');flush();pull(true);return}
 if(d.a=='soon')return toast(d.m||'尚未開放');
 if(d.a=='city')return goCity(d.k);
 if(d.a=='hero'){doA({t:'hero',k:+$('#hk').value});return}
 if(d.a=='hpt'){doA({t:'heropt',d:[0,1,2,3].map(i=>Math.max(0,Math.floor(+$('#hp'+i).value||0)))});return}
 if(d.a=='hrev'){doA({t:'herorev'});return}
 if(d.a=='artdrop'){if(act.cf!=='art'+d.id){act.cf='art'+d.id;toast('再按一次確認丟棄');setTimeout(()=>{if(act.cf==='art'+d.id)act.cf=null},4000);return}act.cf=null;doA({t:'artdrop',id:d.id});return}
 if(d.a=='mkload'){loadMarket();return}
 if(d.a=='al'){const t=d.t,v=i=>($(i)?$(i).value:'');const body={t,id:d.id,o:d.o};
  if(t=='create'){body.tag=v('#altag').trim();body.name=v('#alname').trim()}
  else if(t=='invite'){body.x=+v('#alx');body.y=+v('#aly')}
  else if(t=='msg'){body.s=v('#alms');body.b=v('#almb')}
  else if(t=='leave'||t=='disband'||t=='kick'){const ck=t+(d.o||'');if(act.cf!==ck){act.cf=ck;toast('再按一次確認'+(t=='leave'?'退出':t=='kick'?'移出':'解散'));setTimeout(()=>{if(act.cf===ck)act.cf=null},4000);return}act.cf=null}
  allyDo(body);return}
 if(d.a=='mktgo'){$('#sx').value=d.x;$('#sy').value=d.y;return}
 if(d.a=='help')return modal(HELP);
 if(d.a=='set'){modal(`<h3>遊戲設定</h3>`+(ME?`<p class="mut">線上模式的時間流速由伺服器決定(目前 ×${SPEED})。</p>`:`<p>時間流速 <select id="spd">${[[1,'×1(真實)'],[10,'×10'],[60,'×60'],[300,'×300']].map(([v,n])=>`<option value="${v}" ${v==speed?'selected':''}>${n}</option>`).join('')}</select></p><p class="mut">資源與施工在關閉頁面後仍會繼續,重新開啟時補算(最多 24 小時)。</p>`)+`<p><button data-a="reset">重新開始</button></p>`);return}
 if(d.a=='reset'){if(!act.rc){act.rc=1;toast('再按一次「重新開始」確認清除進度');setTimeout(()=>act.rc=0,4000);return}act.rc=0;
  (async()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'_goff')}catch(e){}GOFF=false;
   if(ME){try{await drain();if(CUR&&CUR!==ME.id){CUR=ME.id;await pull(true)}let r=await api('/api/act',{action:{t:'reset'},rev:REV,c:CUR||undefined});if(r.s==409&&r.j&&r.j.rev!=null){REV=r.j.rev;await api('/api/act',{action:{t:'reset'},rev:REV,c:CUR||undefined})}}catch(e){}REV=0;CUR=null;CITIES=[];setCloud('')}
   S=null;$('#rb').innerHTML=$('#side').innerHTML=$('#main').innerHTML=$('#nav').innerHTML='';pick()})();return}
 if(!S)return;
 if(d.a=='nav'){view=d.v;bv=null;bs=null;dirty=1;if(view=='mail'){mt=ME?mt:'in';loadMail()}}
 else if(d.a=='fld'){fv=+d.i;view='f';dirty=1}
 else if(d.a=='bld'){bs=d.slot==='wall'?'wall':+d.slot;view='b';dirty=1}
 else if(d.a=='f')doA({t:'f',i:+d.i},()=>{view='out'});
 else if(d.a=='b')doA({t:'b',slot:d.slot==='wall'?'wall':+d.slot,id:d.id},()=>{view='in'});
 else if(d.a=='rushall')doA({t:'rushall'});
 else if(d.a=='cancel')doA({t:'cancel',l:d.l});
 else if(d.a=='fill'){const u=us()[+d.k];$('#n'+d.k).value=Math.floor(Math.min(...u.r.map((x,i)=>S.res[i]/x)))}
 else if(d.a=='tr')doA({t:'tr',k:+d.k,n:Math.floor(+$('#n'+d.k).value||0)});
 else if(d.a=='cmd')doA({t:'cmd',id:d.id});
 else if(d.a=='trc')doA({t:'trcancel',b:d.b,i:+d.i});
 else if(d.a=='visit')doA({t:'visit'});
 else if(d.a=='claim')doA({t:'claim',id:d.id});
 else if(d.a=='raid'){const tx=Math.floor(+$('#tx').value),ty=Math.floor(+$('#ty').value),send=us().map((_,k)=>{const e=$('#s'+k);return e?Math.floor(+e.value||0):0}),kind=d.kind=='scout'?'scout':d.kind=='found'?'found':'',tg=[0,1].map(i=>{const e=$('#tg'+i);return e&&e.value?e.value:''}).filter(Boolean);
  if(kind=='found'){if(!ME)return toast('開分城需要登入');const fs=us().map(u=>u.k=='set'?3:0);queueSend({t:'raidp',tx,ty,send:fs,kind});toast('開墾代官出發…')}
  else if(npcAt(tx,ty))doA({t:'raid',tx,ty,send,kind,hero:!!($('#hero')&&$('#hero').checked)});
  else if(!ME)toast('該座標沒有可攻擊的目標(玩家對戰需要登入)');
  else{queueSend({t:'raidp',tx,ty,send,kind,tg,hero:!kind&&!!($('#hero')&&$('#hero').checked)});toast(kind?'偵察兵出發…':'出兵中…')}}
 else if(d.a=='ship'){const r=[0,1,2,3].map(i=>Math.max(0,Math.floor(+$('#m'+i).value||0)));queueSend({t:'shipp',tx:Math.floor(+$('#sx').value),ty:Math.floor(+$('#sy').value),r});toast('商人出發中…')}
 else if(d.a=='offer'){queueSend({t:'offerp',gi:+$('#og').value,ga:Math.floor(+$('#oga').value||0),wi:+$('#ow').value,wa:Math.floor(+$('#owa').value||0)});setTimeout(loadMarket,2500)}
 else if(d.a=='accept'){queueSend({t:'acceptp',id:d.id});setTimeout(loadMarket,2500)}
 else if(d.a=='ocancel'){queueSend({t:'offerx',id:d.id});setTimeout(loadMarket,2500)}
 else if(d.a=='recall'){
  if(d.aid){if(!ME)return;queueSend({t:'recallp',aid:d.aid});toast('撤軍中…')}
  else doA({t:'recall',i:+d.i,tx:+d.x,ty:+d.y})}
 else if(d.a=='dem'){const sl=+d.slot;if(DM!==sl){DM=sl;toast('再按一次確認:拆除一級,不退還資源');setTimeout(()=>{if(DM===sl){DM=null;dirty=1;render()}},4000);dirty=1}else{DM=null;doA({t:'demolish',slot:sl},()=>{view='in'})}}
 else if(d.a=='gogo'){view=d.v;bv=null;bs=null;dirty=1}
 else if(d.a=='goff'){GOFF=true;try{localStorage.setItem(KEY+'_goff','1')}catch(e){}toast('已略過引導,可以在右側「新手引導」面板重新開啟');dirty=1}
 else if(d.a=='gon'){GOFF=false;try{localStorage.removeItem(KEY+'_goff')}catch(e){}dirty=1}
 else if(d.a=='udesc'){UOPEN=UOPEN===+d.k?null:+d.k;dirty=1}
 else if(d.a=='tile'){sel=[+d.x,+d.y];TGT=sel;dirty=1}
 else if(d.a=='tgo'){const sl=slotOf('war');if(sl<0){toast('需要先建造軍奉行');return}bs=sl;view='b';dirty=1}
 else if(d.a=='mp'){mc=[mc[0]+ +d.dx,mc[1]+ +d.dy];dirty=1}
 else if(d.a=='mgo'){mc=[Math.floor(+$('#mx').value||0),Math.floor(+$('#my').value||0)];dirty=1}
 else if(d.a=='mhome'){mc=[home().x,home().y];dirty=1}
 else if(d.a=='buy')doA({t:'buy',res:SH.res,gold:Math.floor(+$('#bgd').value||0)});
 else if(d.a=='bal')doA({t:'balance',r:[0,1,2,3].map(i=>Math.floor(+$('#r'+i).value||0))});
 else if(d.a=='balp'){SH.r=d.p.split(',').map(Number);dirty=1}
 else if(d.a=='rk'){rp=+d.p;dirty=1}
 else if(d.a=='rks'){const a=ranks(),n=Math.floor(+$('#rkn').value||0),m=($('#rkm').value||'').trim();let i=n>0?n-1:m?a.findIndex(r=>r.p.includes(m)||r.h.includes(m)):-1;if(i<0)return toast('找不到');rp=Math.floor(i/10);dirty=1}
 else if(d.a=='mt'){mt=d.t;mo=null;dirty=1;if(mt=='in'||mt=='out')loadMail()}
 else if(d.a=='mread'){mt='read';mo={box:d.box,id:d.id};dirty=1;if(d.box=='in'){const m=MAIL.inbox.find(x=>x.id==d.id);if(m&&!m.r){m.r=true;MAIL.unread=Math.max(0,MAIL.unread-1);api('/api/mail',{t:'read',id:d.id}).catch(()=>{})}}}
 else if(d.a=='mreply'){const m=mfind();if(m&&!m.sys){CMP={x:String(m.from.x),y:String(m.from.y),s:/^Re:/.test(m.s)?m.s:'Re: '+m.s,b:''};mt='new';mo=null;dirty=1}}
 else if(d.a=='mdel'){const m=mfind();if(m){const box=m.box;(async()=>{try{await api('/api/mail',{t:'del',box:box=='in'?'inbox':'sent',id:m.id});}catch(e){}await loadMail();mt=box;mo=null;dirty=1;render()})()}}
 else if(d.a=='mailto'){CMP={x:String(d.x),y:String(d.y),s:'',b:''};view='mail';mt='new';mo=null;dirty=1}
 else if(d.a=='msend'){const x=Math.floor(+$('#mlx').value),y=Math.floor(+$('#mly').value),sj=$('#mls').value,bd=$('#mlb').value;CMP={x:String(x),y:String(y),s:sj,b:bd};
  if(!bd.trim())return toast('信件內容不能是空的');
  (async()=>{try{const r=await api('/api/mail',{t:'send',tx:x,ty:y,s:sj,b:bd});if(r.ok){toast((r.j&&r.j.msg)||'已寄出');CMP={x:'',y:'',s:'',b:''};mt='out';await loadMail()}else toast((r.j&&r.j.msg)||'寄信失敗');}catch(e){toast('寄信失敗,請稍後再試')}dirty=1;render()})()}
 else if(d.a=='ct'){ct=+d.i;dirty=1}
 if(view=='map'&&['nav','mp','mgo','mhome'].includes(d.a))loadWorld();
 if(view=='rank'&&d.a=='nav')loadRank();
 if(dirty)render()}

async function start(){KEY='sg_village_v3'+(ME?'_'+ME.id:'');try{GOFF=localStorage.getItem(KEY+'_goff')==='1'}catch(e){}
 if(ME){NICK=ME.nick||'主公';speed=SPEED;const t0=Date.now();
  try{const r=await api('/api/save');if(r.ok&&r.j){noteSrv(r.j);if(r.j.c)CUR=r.j.c;REV=r.j.rev||0;if(r.j.state){adopt(r.j.state,t0);setCloud('已載入雲端進度')}}else setCloud('同步失敗')}catch(e){setCloud('離線')}
  if(S){drawRes();render();pollMail()}else pick();return}
 if(load()){drawRes();render()}else pick()}

async function boot(){let note='';
 if(/confirmation_token|recovery_token|invite_token|access_token|error=/.test(location.hash)&&window.handleAuthCallback){
  try{const res=await window.handleAuthCallback();if(res)note='信箱驗證完成'}catch(e){note='驗證失敗:'+(e&&e.message||e)}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
 }
 let r=null;try{r=await api('/api/me')}catch(e){}
 if(r&&r.s==200&&r.j&&r.j.id){ME=r.j;$('#who').textContent=ME.email;start()}
 else if(r&&r.s==401)authUI(false,note?note+',請登入':'')
 else start()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset)});
document.addEventListener('change',e=>{if(e.target.id=='csw')goCity(e.target.value);if(e.target.id=='spd'){speed=+e.target.value;if(S&&!ME)save()}if(e.target.id=='brs')SH.res=+e.target.value});
document.addEventListener('input',e=>{const id=e.target.id;if(id=='bgd')SH.gold=Math.max(1,Math.floor(+e.target.value||1));else if(id=='mlx')CMP.x=e.target.value;else if(id=='mly')CMP.y=e.target.value;else if(id=='mls')CMP.s=e.target.value;else if(id=='mlb')CMP.b=e.target.value;else if(/^r[0-3]$/.test(id)){SH.r[+id[1]]=Math.max(0,Math.floor(+e.target.value||0));updBal()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.d)op[d.dataset.d]=d.open},true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'){flush();pull()}});
addEventListener('online',()=>{flush();pull(true)});
const busy=()=>['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
setInterval(()=>{if(!S)return;const n=Date.now(),dt=(n-last)/1000*speed;last=n;G.adv(dt,{quiet:dt/speed>300});
 const sg=(S.log[0]?S.log[0].t+S.log[0].m:'')+S.u.join(',')+JSON.stringify(S.q)+JSON.stringify(S.tr);if(sg!==sig){sig=sg;dirty=1}
 drawRes();updCd();
 if(ME&&Date.now()-lastRes>8000){const nowS=Date.now()+CLK;if(INC.some(e=>e.arrAt<=nowS)||S.mv.some(m=>m.pending&&m.sentAt&&nowS>=m.sentAt+m.dur/SPEED*1000)){lastRes=Date.now();pull(true)}}
 if(dirty&&!busy())render()},250);
setInterval(()=>{if(S){if(!ME)save();if(!busy())render()}},4000);
setInterval(()=>{if(ME&&S){flush();pollMail();pull();if(view=='map')loadWorld()}},60000);
setInterval(()=>{if(ME&&S&&OUT.length&&!flushing&&!AUTHLOST)flush()},8000);
addEventListener('beforeunload',e=>{if(S&&!ME)save();if(ME&&(OUT.length||flushing)){e.preventDefault();e.returnValue=''}});

boot();
</script>
