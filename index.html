<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>車肥羊戰國 · 復刻原型</title>
<style>
:root{--bg:#fffdf6;--pn:#fff;--ink:#3a2410;--bd:#9b5a22;--h1:#f8b53c;--h2:#e08f17;--bt:#fbe3ae;--tb:#f3d6a0;--lk:#8a3a0c;--hero:#1c4fa3;--bad:#c0261b;--ok:#2b7a2b;--act:#f7b733;--mut:#8a7358;--grass:#8fc65f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a10;--pn:#2f2216;--ink:#f1dfc0;--bd:#b8742f;--h1:#a8680f;--h2:#744409;--bt:#4a3320;--tb:#5a3d22;--lk:#f0b060;--hero:#8db8ff;--bad:#ff8a7a;--ok:#7dcc7d;--act:#b8741a;--mut:#b49a78;--grass:#527d38}}
:root[data-theme="dark"]{--bg:#241a10;--pn:#2f2216;--ink:#f1dfc0;--bd:#b8742f;--h1:#a8680f;--h2:#744409;--bt:#4a3320;--tb:#5a3d22;--lk:#f0b060;--hero:#8db8ff;--bad:#ff8a7a;--ok:#7dcc7d;--act:#b8741a;--mut:#b49a78;--grass:#527d38}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
a,[data-a]{cursor:pointer}
a{color:var(--lk);text-decoration:underline}
button,input,select{font:inherit;color:inherit}
button{background:var(--bt);border:1px solid var(--bd);border-radius:4px;padding:2px 10px;font-weight:bold}
button:hover{filter:brightness(.93)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--bad);outline-offset:1px}
input[type=number],input[type=text],input[type=password]{width:70px;background:var(--pn);border:1px solid var(--bd);padding:1px 4px}
#app{max-width:1020px;margin:0 auto}
#hd{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;padding:8px 12px;background:linear-gradient(var(--h1),var(--h2));border-bottom:4px solid var(--bd)}
.logo{font-size:30px;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:2px 2px 0 #7a3b00,-1px -1px 0 #7a3b00;white-space:nowrap}
.logo small{font-size:14px;background:#c0261b;border:2px solid #fff;border-radius:50%;padding:3px 5px;margin-left:4px;vertical-align:middle;letter-spacing:0}
#tn{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
#tn button{font-size:13px;color:var(--lk);background:var(--bt)}
#rb{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 12px;font-size:13px}
.ri{white-space:nowrap}
.bad{color:var(--bad)}.ok{color:var(--ok)}.mut{color:var(--mut)}
#body{display:grid;grid-template-columns:82px minmax(0,1fr) 262px;gap:10px;padding:0 10px 30px}
#nav{display:flex;flex-direction:column;gap:6px}
#nav button{display:flex;flex-direction:column;align-items:center;padding:5px 2px;border:2px solid var(--bd);border-radius:10px;font-size:12px;background:var(--bt)}
#nav button i{font-style:normal;font-size:26px;line-height:1.1}
#nav button.on{background:var(--act);box-shadow:0 0 0 2px #fff inset}
#main{min-width:0}
.ttl{font-size:22px;font-weight:bold;margin:2px 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ttl small{font-size:14px;font-weight:normal}
.flag{display:inline-block;background:#f08a1c;color:#fff;font-size:15px;padding:4px 7px 9px;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);border:0}
.flag.s{font-size:11px;padding:1px 4px 5px}
.cols{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.info{min-width:150px;flex:1}
.sh{margin:10px 0 3px;font-size:14px}
.fr{border:7px solid #8a4b1d;outline:1px solid #4d2808;box-shadow:inset 0 0 0 2px #d79a58;position:relative;overflow:hidden}
.sc{width:100%}
.sc-out{max-width:470px;aspect-ratio:1/1;background:radial-gradient(circle at 47% 30%,#a7d877,#86bb58 65%,#74a84a)}
.sc-in{max-width:640px;aspect-ratio:4/3.2;background:radial-gradient(circle at 50% 40%,#9ccb6c,#7fb552 70%,#6e9e44)}
.yard{position:absolute;left:4%;top:4%;width:92%;height:80%;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(0,0,0,.05) 38px 40px),repeating-linear-gradient(0deg,#c9cdc3 0 38px,#bfc4b9 38px 40px)}
.yard.nowall{outline:2px dashed rgba(60,40,20,.45);outline-offset:-1px}
.wl{position:absolute;cursor:pointer;z-index:1;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.tw{position:absolute;cursor:pointer;z-index:2;border:2px solid rgba(0,0,0,.55);border-top:6px dotted rgba(0,0,0,.6);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.wood .wl.h{background:repeating-linear-gradient(90deg,#8a5a2c 0 7px,#5e3a18 7px 9px)}
.wood .wl.v{background:repeating-linear-gradient(0deg,#8a5a2c 0 7px,#5e3a18 7px 9px)}
.wood .tw{background:#6e4520}
.brick .wl.h{background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(70,25,12,.55) 5px 6px),repeating-linear-gradient(90deg,#b4533c 0 13px,#8f3d2b 13px 14px)}
.brick .wl.v{background:repeating-linear-gradient(90deg,transparent 0 5px,rgba(70,25,12,.55) 5px 6px),repeating-linear-gradient(0deg,#b4533c 0 13px,#8f3d2b 13px 14px)}
.brick .tw{background:#a04632}
.stone .wl.h{background:repeating-linear-gradient(0deg,transparent 0 7px,rgba(40,44,50,.6) 7px 8px),repeating-linear-gradient(90deg,#a3a9b0 0 18px,#7c838b 18px 20px)}
.stone .wl.v{background:repeating-linear-gradient(90deg,transparent 0 7px,rgba(40,44,50,.6) 7px 8px),repeating-linear-gradient(0deg,#a3a9b0 0 18px,#7c838b 18px 20px)}
.stone .tw{background:#8d949b}
.wlab{position:absolute;left:50%;top:0;transform:translate(-50%,-2px);z-index:3;cursor:pointer}
.gate{position:absolute;left:50%;top:84%;transform:translate(-50%,-50%);z-index:3;font-size:26px;cursor:pointer}
.it{position:absolute;transform:translate(-50%,-50%);text-align:center;line-height:1}
.it .em{font-size:clamp(22px,5vw,36px);white-space:nowrap}
.lv{display:inline-block;min-width:22px;padding:1px 4px;background:#222;color:#fff;border:2px solid #fff;border-radius:5px;font-size:13px;line-height:15px}
.it .em+.lv{position:relative;top:-6px}
.lv.sm{position:absolute;right:-10px;top:-4px;font-size:10px;min-width:16px;line-height:11px;padding:0 2px;border-width:1px}
.crop{width:68px;height:38px;background:linear-gradient(#f6cf55,#e8b230);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);display:flex;align-items:center;justify-content:center}
.lb{display:inline-block;background:#c0261b;color:#fff;border:1px solid #fff;font-size:12px;width:19px;height:19px;line-height:17px;margin-top:-8px;position:relative}
.dim{opacity:.4;filter:grayscale(.6)}
.plot .em{opacity:.55}
.sc-in .it{z-index:4}
.it.big .em{font-size:46px}
.lamp{display:inline-block;width:26px;height:26px;line-height:24px;text-align:center;border-radius:50%;border:2px solid var(--bd);margin:2px;font-weight:bold;background:#ddd;color:#888}
.lamp.on{background:#f0b400;color:#7a1b0c}
table.tb{border-collapse:collapse;width:100%;max-width:640px;margin:6px 0}
.tb th{background:var(--tb);border:1px solid var(--bd);padding:3px 6px;color:var(--lk)}
.tb td{border:1px solid var(--bd);padding:3px 6px;text-align:center;background:var(--pn)}
.tb tr.me td{background:var(--tb);font-weight:bold}
.tb td.hero{color:var(--hero);font-weight:bold}
.x{color:var(--bad);font-weight:bold;text-decoration:none}
.tabs{margin:6px 0}
.pg{text-align:center;margin:8px 0}
#side details{border:1px solid var(--bd);background:var(--pn);margin-bottom:6px}
#side summary{padding:3px 8px;cursor:pointer;list-style:none;font-weight:bold}
#side summary::before{content:"+ ";color:var(--lk)}
#side details[open] summary::before{content:"− "}
.dbody{padding:4px 10px 8px;border-top:1px solid var(--bd)}
.ct{display:flex}
.ct span{flex:1;text-align:center;padding:2px;background:var(--tb);border:1px solid var(--bd);font-weight:bold;cursor:pointer}
.ct span.on{background:var(--act)}
#chat{height:230px;overflow-y:auto;border:1px solid var(--bd);border-top:0;background:var(--pn);padding:4px 6px;font-size:12px}
#chat .t{color:var(--ok)}
.scroll{background:var(--act);border-radius:18px;padding:14px;max-width:560px;margin:8px 0}
.paper{background:repeating-linear-gradient(#fdf1d4 0 22px,#cdb98d 22px 23px);color:#3a2410;padding:10px 14px;min-height:240px;line-height:23px}
.paper b{color:#7a2d0f}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#c0261b;color:#fff;padding:6px 16px;border-radius:4px;display:none;z-index:9}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:8;padding:14px;overflow:auto}
#modal .box{background:var(--bg);border:3px solid var(--bd);padding:16px 18px;max-width:720px;max-height:92%;overflow:auto}
#modal .box h3{margin:0 0 6px}
#modal .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:8px 0}
#modal .cd{border:2px solid var(--bd);background:var(--pn);padding:8px}
.map-w{max-width:620px}
svg text{user-select:none}
@media(max-width:860px){#body{grid-template-columns:1fr}#nav{flex-direction:row;overflow-x:auto}#nav button{min-width:62px}}
</style>
</head>
<body>
<div id="app">
<div id="hd"><div class="logo">🐑 車肥羊<small>戰國</small></div>
<span id="who" class="mut" style="font-size:12px"></span><span id="cloud" class="mut" style="font-size:12px"></span><div id="tn"><button data-a="help">遊戲指南</button><button data-a="set">遊戲設定</button><button data-a="soon" data-m="每日一題尚未開放">每日一題</button><button data-a="soon" data-m="論壇尚未開放">論 壇</button><button data-a="soon" data-m="客服中心尚未開放">客服中心</button><button data-a="logout">登 出</button><button data-a="nav" data-v="shop">商 城</button></div></div>
<div id="rb"></div>
<div id="body"><nav id="nav"></nav><main id="main"></main><aside id="side"></aside></div>
</div>
<div id="toast"></div><div id="modal"></div>
<script src="/auth.js"></script>
<script src="/game.js"></script>
<script>
let KEY='sg_village_v3',ME=null,NICK='主公';
const $=s=>document.querySelector(s);
// S 就是 G.S(遊戲規則模組裡的目前狀態),UI 與規則共用同一份
Object.defineProperty(window,'S',{get(){return G.S},set(v){G.S=v},configurable:true});
const {SPEED,CD,NSLOTS,MULTI,GOLD_RATE,EXCHANGE_COST,PROTECT_DAYS,RN,FN,FT,FC,F,W,UN,N,B,CM,QS,pw,fa,us,br,bn,lane,capAt,hideAt,cap,hide,prod,mult,rate,bpop,upkeep,hallM,costF,durF,costB,durB,fmax,reqOk,reqT,canPay,pay,logm,ab,db,wb,npcAt,home,distTo,prest,canBuildNew,slotOf}=G;
const FAC={wei:'織田',shu:'德川',wu:'豐臣'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RI=['🪵','🧱','🪨','🌾'];
const fmt=n=>String(Math.floor(n));

const FP=[[12,79],[53,84],[72,88],[44,55],[16,62],[72,60],[33,89],[88,82],[16,14],[40,13],[23,36],[36,65],[71,17],[90,17],[71,35],[87,32],[91,50],[91,63]];
const SLOT={lum:['🪵','木',24,15],kiln:['🏺','陶',9,25],gr:['🛖','米',13,46],wh:['🏠','倉',28,47],gov:['🏯','衙',45,47],war:['⛩️','兵',60,48],acad:['🏫','學',87,47],smi:['🗡️','器',12,70],cavb:['🐎','騎',33,71],infb:['⛺','步',48,71],smel:['🔥','冶',68,70],arm:['🥋','甲',86,70],mill:['⚙️','磨',14,89],cave:['🕳️','窖',30,89],wall:['🚪','牆',52,93]};
const LK=[['palace','🏛️','宮',50,13,'本丸御殿'],['rites','⛲','禮',74,13,'禮儀所'],['hongl','🛕','寺',87,27,'奏者番'],['offi','🏢','吏',73,50,'評定眾'],['mkt','🏪','市',86,89,'樂市樂座']];
const HN=['織田信長','德川家康','豐臣秀吉','武田信玄','上杉謙信','毛利元就','伊達政宗','北條氏康','今川義元','明智光秀','柴田勝家','前田利家','真田幸村','本多忠勝','石田三成','竹中半兵衛','黑田官兵衛','島津義弘','長宗我部元親','齋藤道三','淺井長政','朝倉義景','三好長慶','大友宗麟','龍造寺隆信','山本勘助','直江兼續','立花宗茂','加藤清正','福島正則'];
const PN=['桶狹間','長篠合戰','關原','川中島','本能寺','姊川','賤岳','小牧長久手','山崎合戰','石山本願寺','天下布武','風林火山','三矢之訓','一夜城','金崎撤退','小田原','大阪夏之陣','七本槍','三河武士','甲州流','越後之龍','鐵砲三段','樂市樂座','太閤檢地','刀狩令','南蠻貿易','忍者村','伊賀越','尾張大傻瓜','猿面冠者'];
const RK=HN.map((h,i)=>({h,p:PN[i],v:Math.round(6000/Math.pow(i+1,1.25))+20,c:1+(i*7)%6,l:30+(i*13)%50,e:(i*7919)%90000}));
const tm=s=>{s=Math.max(0,Math.ceil(s));return[s/3600|0,(s/60|0)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')};
const pad=n=>String(n).padStart(2,'0');
const clk=t=>{const s=Math.floor(8*3600+t)%86400;return pad(s/3600|0)+':'+pad(s/60%60|0)};
const dstr=t=>{const d=new Date(2011,9,23+Math.floor((8*3600+t)/86400));return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+clk(t)};
const costH=c=>c.map((x,i)=>`<span class="${S.res[i]>=x?'':'bad'}">${RI[i]}${x}</span>`).join(' ');
const ter=(x,y)=>['🌲','💧','⛰️','🌾','','',''][(((x*73856093)^(y*19349663))>>>0)%7];
let view='out',bv=null,bs=null,fv=0,sel=null,mc=[0,0],curPos='',rp=0,mt='in',ct=0,dirty=1,speed=SPEED,last=Date.now(),op={},TGT=null,sig='',SH={res:0,gold:1,r:[1,1,1,1]},VIL=new Map(),RKD=null;

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2400)}
function modal(h){const m=$('#modal');m.innerHTML='<div class="box">'+h+'<p><button data-a="close">關閉</button></p></div>';m.style.display='flex'}
function pick(){const m=$('#modal');m.style.display='flex';
 m.innerHTML='<div class="box"><h3>選擇你的勢力</h3><p class="mut">開局後無法更改。你只有一座小村莊,先從種樹、挖礦、屯糧開始。</p><div class="g">'+Object.entries(F).map(([k,v])=>`<div class="cd"><span class="flag">${v.s}</span><p>${v.d}</p><p>兵種:${UN[k].map(u=>u.n).join('、')}</p><button data-a="pick" data-f="${k}">加入${v.n}</button></div>`).join('')+'</div></div>'}

function syncMc(){const h=home(),pk=h.x+','+h.y;if(pk!==curPos){curPos=pk;mc=[h.x,h.y]}}
function nearestCamp(){const h=home();let best=null,bd=1e9;for(let r=0;r<=14;r++)for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const x=h.x+dx,y=h.y+dy,n=npcAt(x,y);if(n&&!n.zg){const d=Math.hypot(dx,dy);if(d<bd){bd=d;best=[x,y]}}}return best||[h.x+1,h.y+1]}
async function loadWorld(){if(!ME||!S)return;const [cx,cy]=mc;try{const r=await api('/api/world?x0='+(cx-6)+'&y0='+(cy-6)+'&x1='+(cx+6)+'&y1='+(cy+6));
 if(r.ok&&r.j&&r.j.villages){for(const k of [...VIL.keys()]){const [x,y]=k.split(',').map(Number);if(x>=cx-6&&x<=cx+6&&y>=cy-6&&y<=cy+6)VIL.delete(k)}r.j.villages.forEach(v=>VIL.set(v.x+','+v.y,v));dirty=1}}catch(e){}}
async function loadRank(){if(!ME)return;try{const r=await api('/api/rank');if(r.ok&&r.j&&r.j.rows){RKD=r.j;dirty=1}}catch(e){}}
function save(){try{S.saved=Date.now();S.spd=speed;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(!s)return false;S=G.fix(JSON.parse(s));speed=S.spd||SPEED;const real=Math.min((Date.now()-S.saved)/1000,24*3600);if(real>0)G.adv(real*speed,{quiet:real>300});syncMc();return true}catch(e){return false}}

const HELP='<h3>遊戲指南</h3><p>這是依據原作資料還原的單機原型。</p><ul><li>資源田(外城)產出木材、泥土、鐵塊、糧食。內城有 21 塊空地,自己決定要蓋什麼;城牆環繞城內建地,不佔建地。</li><li>知行所每個村莊只能一座;藏屋敷、米藏、埋藏所在現有的升到滿級後可以再蓋新的,效果加總。</li><li>知行所等級越高,所有施工越快(最多省 50%)。只有織田家能外城內城同時施工。</li><li>藏屋敷、米藏最高 20 級,容量 10 萬。</li><li>建築人口與軍隊都要吃糧;右上角資源列最後一項是「耗糧 / 糧食總產量」。</li><li>「埋藏所」可以藏起資源,避免被其他玩家搶走。城牆環繞城內建地,提高守軍防禦(織田家木柵、德川家石垣、豐臣家土壘漆壁)。</li><li>出征中的兵一樣要吃糧;糧食耗盡時,出征中的兵也會逃亡。</li><li>兵營訓練士兵;軍奉行出兵掠奪地圖上的據點。行軍速度取決於隊伍中最慢的兵種。</li><li>刀鍛冶所、具足屋每級加成兵種攻防 1.5%。</li><li>在地圖上的菩提山城行三顧之禮,可以請出竹中半兵衛。</li><li>商城:用金幣買資源,或把現有資源依比例平倉。</li><li>可以出兵掠奪其他玩家的村莊(對方在新手保護期內不行)。</li></ul><p class="mut">尚未實作:英雄、綠洲、寶物、集市、聯盟、資源運送、增援。</p>';
function drawRes(){const up=upkeep(),pd=rate(3);
 $('#rb').innerHTML=[0,1,2,3].map(i=>`<span class="ri" title="${RN[i]}">${RI[i]}${fmt(S.res[i])}/${cap(i)}</span>`).join('')+`<span class="ri" title="埋藏所可藏匿的量(每種資源)">🏺${hide()}</span><span class="ri ${up>pd?'bad':''}" title="耗糧 / 糧食總產量(每小時)">🍚${fmt(up)}/${fmt(pd)}</span>`}
function updCd(){document.querySelectorAll('[data-cd]').forEach(e=>e.textContent=tm(+e.dataset.cd-S.t))}
const ttl=()=>`<div class="ttl"><span class="flag">${fa().s}</span>${NICK}的村庄<small>(${home().x}|${home().y})</small><small class="mut">主城</small></div>`;
const back=v=>`<p><a data-a="nav" data-v="${v}">« 返回${v=='in'?'內城':'外城'}</a></p>`;
function qtab(){const rows=['f','b'].filter(l=>S.q[l]);if(!rows.length)return'';

 const a=[...RK,{h:'—',p:esc(NICK)+'(你)',v:prest(),c:1,l:1,e:0,me:1}].sort((x,y)=>y.v-x.v);return a.map((r,i)=>({...r,i:i+1}))}
function vRank(){const a=ranks(),mp=Math.max(0,Math.ceil(a.length/10)-1);rp=Math.max(0,Math.min(rp,mp));
 return `<div class="ttl" style="justify-content:center">英 雄 榜</div><p class="tabs" style="text-align:center"><b>玩家</b> | ${['城池','聯盟','進攻','防禦','武將','寶鼎','總覽'].map(t=>`<a data-a="soon">${t}</a>`).join(' | ')}</p><p style="text-align:right"><a data-a="soon" data-m="威望來自資源田、建築的等級與軍隊規模">威望如何獲得?</a></p><table class="tb"><tr><th>排名</th><th>武將</th><th>玩家</th><th>威望</th><th>城池</th><th>等級</th><th>經驗值</th></tr>`+(ME&&!RKD?'<tr><td colspan="7">載入中…</td></tr>':'')+a.slice(rp*10,rp*10+10).map(r=>`<tr class="${r.me?'me':''}"><td>${r.i}</td><td class="hero">${r.h}</td><td>${r.p}</td><td>${r.v}</td><td>${r.c}</td><td>${r.l}</td><td>${r.e}</td></tr>`).join('')+`</table><p class="pg"><a data-a="rk" data-p="0">首頁</a> <a data-a="rk" data-p="${rp-1}">上一頁</a> <a data-a="rk" data-p="${rp+1}">下一頁</a> <a data-a="rk" data-p="${mp}">尾頁</a><br>排名: <input id="rkn" type="number"> 或是,名字: <input id="rkm" type="text"> <button data-a="rks">查找</button></p>`}
function vQuest(){return `<div class="ttl">任務</div><table class="tb"><tr><th>任務</th><th>獎勵</th><th></th></tr>`+QS.map(q=>{const dn=S.qd.includes(q.id),ok=q.ok();return `<tr><td>${q.n}</td><td>${q.g?'🪙'+q.g+' 金幣':q.r.map((x,i)=>RI[i]+x).join(' ')}</td><td>${dn?'<span class="mut">已領取</span>':ok?`<button data-a="claim" data-id="${q.id}">領取</button>`:'<span class="mut">未完成</span>'}</td></tr>`}).join('')+'</table>'}
const vRep=()=>`<div class="ttl">報告</div>`+(S.rep.length?`<table class="tb"><tr><th>時間</th><th>內容</th></tr>${S.rep.map(r=>`<tr><td>${dstr(r.t)}</td><td style="text-align:left">${r.m}</td></tr>`).join('')}</table>`:'<p class="mut">目前沒有報告。</p>');
function vMail(){const tabs=[['in','收件箱'],['new','撰寫'],['out','已發送'],['sys','系統消息']].map(([k,n])=>mt==k?`<b>${n}</b>`:`<a data-a="mt" data-t="${k}">${n}</a>`).join(' | ');
 let b='';
 if(mt=='in')b=`<p>寄件人:<b>系統</b></p><p>主 題:<b>歡迎來到戰國!</b></p><p>你的村莊在 (${home().x}|${home().y}),請先升級資源田、建造藏屋敷與米藏,再訓練軍隊。埋藏所可以藏起資源,避免被其他玩家搶走。</p>`;
 else if(mt=='new')b='<p>收件人:<input type="text" disabled></p><p>主 題:<input type="text" disabled></p><p class="mut">單機版沒有其他玩家,無法寄信。</p>';
 else if(mt=='out')b='<p class="mut">沒有已發送的信件。</p>';
 else b=S.log.slice(0,10).map(l=>`<div><span class="mut">${dstr(l.t)}</span> ${l.m}</div>`).join('');
 return `<div class="ttl">飛鴿傳書</div><p style="text-align:center">${tabs}</p><div class="scroll"><div class="paper">${b}</div></div><p style="text-align:center"><button data-a="soon">回復</button> <button data-a="soon">刪除</button> <button data-a="nav" data-v="out">返回</button></p>`}
const NAV=[['out','外城','⛰️'],['in','內城','🏯'],['map','地圖','🗺️'],['rank','排行榜','📜'],['quest','任務','🏆'],['rep','報告','⚔️'],['mail','飛鴿傳書','🕊️'],['x','意見箱','💬'],['x','跨服戰','🚩']];
function sidebar(){const det=(id,sm,body)=>`<details data-d="${id}" ${op[id]?'open':''}><summary>${sm}</summary><div class="dbody">${body}</div></details>`;
 const cl=QS.filter(q=>!S.qd.includes(q.id)&&q.ok()).length;
 const msgs=ct==0?S.log.slice(0,30).reverse().map(l=>`<div><span class="t">(${dstr(l.t)})</span> <b class="bad">【系統訊息】</b>${l.m}</div>`).join(''):`<div class="mut">${ct==1?'尚未加入聯盟':'沒有密語'}</div>`;
 return det('acc','賬號狀態: 正常',`玩家:${NICK}<br>勢力:${fa().n}`)+det('city','城池清單',`|- ${NICK}的村庄(${home().x},${home().y}) <span class="flag s">${fa().s}</span>`)+det('goods',`商品清單 🎁:${fmt(S.gold)}`,'金幣用來立即完成施工(2 金幣/次),每遊戲小時 +1。')+det('task',`任務清單${cl?` <b class="bad">(${cl})</b>`:''}`,'<a data-a="nav" data-v="quest">前往任務頁面</a>')+det('faq','常見問題','<a data-a="help">遊戲指南</a>')
 +`<div class="ct">${['公頻','盟頻','密頻'].map((n,i)=>`<span data-a="ct" data-i="${i}" class="${ct==i?'on':''}">${n}</span>`).join('')}</div><div id="chat">${msgs}</div>`}
function render(){
 $('#nav').innerHTML=NAV.map(([v,n,ic])=>`<button data-a="${v=='x'?'soon':'nav'}" data-v="${v}" class="${view==v||(v=='out'&&view=='f')||(v=='in'&&view=='b')?'on':''}"><i>${ic}</i>${n}</button>`).join('');
 const V={shop:vShop,out:vOut,in:vIn,f:vF,b:vB,map:vMap,rank:vRank,quest:vQuest,rep:vRep,mail:vMail};
 $('#main').innerHTML=V[view]();$('#side').innerHTML=sidebar();const c=$('#chat');if(c)c.scrollTop=c.scrollHeight;dirty=0}

async function api(p,b,m,k){const r=await fetch(p,{method:m||(b?'POST':'GET'),headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined,credentials:'same-origin',keepalive:!!k});let j=null;try{j=await r.json()}catch(e){}return{ok:r.ok&&(!j||j.ok!==false),s:r.status,j}}
function authUI(reg,msg){const m=$('#modal');m.style.display='flex';
 m.innerHTML=`<div class="box"><h3>${reg?'註冊':'登入'}</h3>${msg?`<p class="bad">${msg}</p>`:''}<p>電子郵件 <input id="ae" type="text" style="width:220px"></p><p>密碼 <input id="ap" type="password" style="width:220px"></p>${reg?'<p>暱稱 <input id="an" type="text"></p>':''}<p><button data-a="${reg?'dosign':'dolog'}">${reg?'註冊':'登入'}</button> <a data-a="authsw" data-r="${reg?0:1}">${reg?'已有帳號?登入':'沒有帳號?註冊'}</a></p></div>`}
async function doLogin(){const r=await api('/api/login',{email:$('#ae').value.trim(),password:$('#ap').value});if(!r.ok)return authUI(false,'登入失敗:'+((r.j&&r.j.error)||'請確認帳號密碼'));await finish()}
async function doSign(){const email=$('#ae').value.trim(),password=$('#ap').value,nickname=$('#an').value.trim();const r=await api('/api/signup',{email,password,nickname});
 if(!r.ok)return authUI(true,'註冊失敗:'+((r.j&&r.j.error)||'請稍後再試'));
 const l=await api('/api/login',{email,password});if(!l.ok)return authUI(false,'註冊完成。若需要信箱驗證,請先到信箱點擊驗證連結,再回來登入');await finish()}
async function finish(){const r=await api('/api/me');if(r.ok&&r.j&&r.j.id){ME=r.j;$('#modal').style.display='none';$('#who').textContent=ME.email;start()}else authUI(false,'無法確認登入狀態')}
async function doLogout(){if(!ME)return toast('目前是訪客模式(沒有連上後端)');try{await chain}catch(e){}await api('/api/logout',{});location.reload()}

let REV=0,pend=0,chain=Promise.resolve();
const tnow=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const setCloud=t=>{$('#cloud').textContent=t?' ☁ '+t:''};
function adopt(st,t0){S=G.fix(st);speed=SPEED;const lag=(Date.now()-t0)/1000;if(lag>0)G.adv(lag*speed,{quiet:true});syncMc();dirty=1}
function queueSend(a){pend++;chain=chain.then(()=>send(a)).catch(()=>{}).then(()=>{pend--})}
async function send(a){const t0=Date.now();
 try{const r=await api('/api/act',{action:a,rev:REV},'POST',1),j=r.j||{};
  if(j.state&&j.rev!=null){REV=j.rev;if(pend<=1||!r.ok)adopt(j.state,t0)}
  else if(r.s==409)await pull(true);
  if(r.ok){setCloud('已同步 '+tnow());if(j.msg)toast(j.msg)}else{if(j.msg)toast(j.msg);if(!j.state&&r.s!=409)setCloud('同步失敗')}
 }catch(e){setCloud('離線')}}
async function pull(force){if(!ME||(pend&&!force))return;const t0=Date.now();
 try{const r=await api('/api/save');if(r.ok&&r.j){REV=r.j.rev||0;if(r.j.state){adopt(r.j.state,t0);setCloud('已同步 '+tnow())}}}catch(e){setCloud('離線')}}

function doA(a,after){const r=G.perform(a);if(!r.ok){toast(r.msg||'無法執行');return false}if(r.msg)toast(r.msg);if(after)after();dirty=1;if(ME)queueSend(a);else save();return true}
function newGame(f){S=G.init(f);if(ME)speed=SPEED;view='out';bv=null;curPos='';syncMc();sel=null;TGT=null;VIL.clear();$('#modal').style.display='none';dirty=1;if(ME)queueSend({t:'init',fac:f});else save();render()}
function act(d){
 if(d.a=='pick')return newGame(d.f);
 if(d.a=='close'){$('#modal').style.display='none';return}
 if(d.a=='authsw')return authUI(d.r=='1');
 if(d.a=='dolog')return doLogin();
 if(d.a=='dosign')return doSign();
 if(d.a=='logout')return doLogout();
 if(d.a=='soon')return toast(d.m||'尚未開放');
 if(d.a=='help')return modal(HELP);
 if(d.a=='set'){modal(`<h3>遊戲設定</h3>`+(ME?`<p class="mut">線上模式的時間流速由伺服器決定(目前 ×${SPEED})。</p>`:`<p>時間流速 <select id="spd">${[[1,'×1(真實)'],[10,'×10'],[60,'×60'],[300,'×300']].map(([v,n])=>`<option value="${v}" ${v==speed?'selected':''}>${n}</option>`).join('')}</select></p><p class="mut">資源與施工在關閉頁面後仍會繼續,重新開啟時補算(最多 24 小時)。</p>`)+`<p><button data-a="reset">重新開始</button></p>`);return}
 if(d.a=='reset'){if(!act.rc){act.rc=1;toast('再按一次「重新開始」確認清除進度');setTimeout(()=>act.rc=0,4000);return}act.rc=0;
  (async()=>{try{localStorage.removeItem(KEY)}catch(e){}
   if(ME){try{await chain;let r=await api('/api/act',{action:{t:'reset'},rev:REV});if(r.s==409&&r.j&&r.j.rev!=null){REV=r.j.rev;await api('/api/act',{action:{t:'reset'},rev:REV})}}catch(e){}REV=0;setCloud('')}
   S=null;$('#rb').innerHTML=$('#side').innerHTML=$('#main').innerHTML=$('#nav').innerHTML='';pick()})();return}
 if(!S)return;
 if(d.a=='nav'){view=d.v;bv=null;bs=null;dirty=1}
 else if(d.a=='fld'){fv=+d.i;view='f';dirty=1}
 else if(d.a=='bld'){bs=d.slot==='wall'?'wall':+d.slot;view='b';dirty=1}
 else if(d.a=='f')doA({t:'f',i:+d.i},()=>{view='out'});
 else if(d.a=='b')doA({t:'b',slot:d.slot==='wall'?'wall':+d.slot,id:d.id},()=>{view='in'});
 else if(d.a=='rushall')doA({t:'rushall'});
 else if(d.a=='cancel')doA({t:'cancel',l:d.l});
 else if(d.a=='fill'){const u=us()[+d.k];$('#n'+d.k).value=Math.floor(Math.min(...u.r.map((x,i)=>S.res[i]/x)))}
 else if(d.a=='tr')doA({t:'tr',k:+d.k,n:Math.floor(+$('#n'+d.k).value||0)});
 else if(d.a=='cmd')doA({t:'cmd',id:d.id});
 else if(d.a=='visit')doA({t:'visit'});
 else if(d.a=='claim')doA({t:'claim',id:d.id});
 else if(d.a=='raid'){const tx=Math.floor(+$('#tx').value),ty=Math.floor(+$('#ty').value),send=us().map((_,k)=>Math.floor(+$('#s'+k).value||0));
  if(npcAt(tx,ty))doA({t:'raid',tx,ty,send});
  else if(!ME)toast('該座標沒有可攻擊的目標(玩家對戰需要登入)');
  else{queueSend({t:'raidp',tx,ty,send});toast('出兵中…')}}
 else if(d.a=='tile'){sel=[+d.x,+d.y];TGT=sel;dirty=1}
 else if(d.a=='tgo'){const sl=slotOf('war');if(sl<0){toast('需要先建造軍奉行');return}bs=sl;view='b';dirty=1}
 else if(d.a=='mp'){mc=[mc[0]+ +d.dx,mc[1]+ +d.dy];dirty=1}
 else if(d.a=='mgo'){mc=[Math.floor(+$('#mx').value||0),Math.floor(+$('#my').value||0)];dirty=1}
 else if(d.a=='mhome'){mc=[home().x,home().y];dirty=1}
 else if(d.a=='buy')doA({t:'buy',res:SH.res,gold:Math.floor(+$('#bgd').value||0)});
 else if(d.a=='bal')doA({t:'balance',r:[0,1,2,3].map(i=>Math.floor(+$('#r'+i).value||0))});
 else if(d.a=='balp'){SH.r=d.p.split(',').map(Number);dirty=1}
 else if(d.a=='rk'){rp=+d.p;dirty=1}
 else if(d.a=='rks'){const a=ranks(),n=Math.floor(+$('#rkn').value||0),m=($('#rkm').value||'').trim();let i=n>0?n-1:m?a.findIndex(r=>r.p.includes(m)||r.h.includes(m)):-1;if(i<0)return toast('找不到');rp=Math.floor(i/10);dirty=1}
 else if(d.a=='mt'){mt=d.t;dirty=1}
 else if(d.a=='ct'){ct=+d.i;dirty=1}
 if(view=='map'&&['nav','mp','mgo','mhome'].includes(d.a))loadWorld();
 if(view=='rank'&&d.a=='nav')loadRank();
 if(dirty)render()}

async function start(){KEY='sg_village_v3'+(ME?'_'+ME.id:'');
 if(ME){NICK=ME.nick||'主公';speed=SPEED;const t0=Date.now();
  try{const r=await api('/api/save');if(r.ok&&r.j){REV=r.j.rev||0;if(r.j.state){adopt(r.j.state,t0);setCloud('已載入雲端進度')}}else setCloud('同步失敗')}catch(e){setCloud('離線')}
  if(S){drawRes();render()}else pick();return}
 if(load()){drawRes();render()}else pick()}

async function boot(){let note='';
 if(/confirmation_token|recovery_token|invite_token|access_token|error=/.test(location.hash)&&window.handleAuthCallback){
  try{const res=await window.handleAuthCallback();if(res)note='信箱驗證完成'}catch(e){note='驗證失敗:'+(e&&e.message||e)}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
 }
 let r=null;try{r=await api('/api/me')}catch(e){}
 if(r&&r.s==200&&r.j&&r.j.id){ME=r.j;$('#who').textContent=ME.email;start()}
 else if(r&&r.s==401)authUI(false,note?note+',請登入':'')
 else start()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset)});
document.addEventListener('change',e=>{if(e.target.id=='spd'){speed=+e.target.value;if(S&&!ME)save()}if(e.target.id=='brs')SH.res=+e.target.value});
document.addEventListener('input',e=>{const id=e.target.id;if(id=='bgd')SH.gold=Math.max(1,Math.floor(+e.target.value||1));else if(/^r[0-3]$/.test(id)){SH.r[+id[1]]=Math.max(0,Math.floor(+e.target.value||0));updBal()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.d)op[d.dataset.d]=d.open},true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')pull()});
const busy=()=>['INPUT','SELECT'].includes(document.activeElement.tagName);
setInterval(()=>{if(!S)return;const n=Date.now(),dt=(n-last)/1000*speed;last=n;G.adv(dt,{quiet:dt/speed>300});
 const sg=(S.log[0]?S.log[0].t+S.log[0].m:'')+S.u.join(',')+JSON.stringify(S.q)+JSON.stringify(S.tr);if(sg!==sig){sig=sg;dirty=1}
 drawRes();updCd();if(dirty&&!busy())render()},250);
setInterval(()=>{if(S){if(!ME)save();if(!busy())render()}},4000);
setInterval(()=>{if(ME&&S&&!pend)pull();if(ME&&S&&view=='map')loadWorld()},60000);
addEventListener('beforeunload',()=>{if(S&&!ME)save()});

boot();
</script>
</body>
</html>
