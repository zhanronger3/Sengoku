<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>管理者 · 發送金幣與意見箱</title>
<style>
:root{--bg:#3f0a10;--pn:#120c0d;--ink:#f1e6d3;--bd:#9a7a46;--gold:#d4b370;--tb:#4d0c18;--mut:#c2b09a;--bad:#ff8272;--ok:#9bd596;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(#4a0c14,#2d070d);color:var(--ink);font:14px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
main{width:100%;max-width:680px;margin:0 auto;padding:16px;flex:1 0 auto}
h1{font-size:22px;margin:6px 0 4px;color:var(--gold)}
.box{background:var(--pn);border:1px solid var(--bd);padding:12px 14px;margin:12px 0;border-radius:4px}
label{display:block;margin:8px 0 2px;color:var(--mut)}
input,select,textarea{width:100%;background:#1b1415;color:var(--ink);border:1px solid var(--bd);padding:6px 8px;font:inherit;border-radius:3px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{margin-top:12px;background:#8a1026;color:#fff;border:1px solid var(--gold);padding:7px 16px;font:inherit;font-weight:bold;border-radius:4px;cursor:pointer}
button.alt{background:#14161d}
#msg{margin-top:10px;white-space:pre-wrap}.ok{color:var(--ok)}.bad{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--bd);padding:3px 6px;text-align:center}th{background:var(--tb);color:var(--gold)}
footer{flex-shrink:0;text-align:center;padding:14px 12px;border-top:1px solid rgba(212,179,112,.35);background:rgba(0,0,0,.3);color:var(--mut);font-size:12px}
.tag{display:inline-block;padding:1px 8px;border:1px solid var(--mut);border-radius:10px;font-size:12px}
</style>
</head>
<body>
<main>
<h1>發送金幣給玩家</h1>
<p style="color:var(--mut)">只有知道管理密碼(Netlify 環境變數 <code>ADMIN_SECRET</code>)的人才能使用。密碼只會留在這個分頁裡,不會存到任何地方。</p>
<div class="box">
  <label for="secret">管理密碼</label>
  <input id="secret" type="password" autocomplete="off" placeholder="ADMIN_SECRET">
  <label for="how">用什麼找玩家</label>
  <select id="how"><option value="xy">城池座標(最準確)</option><option value="nick">暱稱(只找得到排行榜前 200 名)</option><option value="uid">帳號 ID</option></select>
  <div id="f-xy" class="row"><div><label for="x">x</label><input id="x" type="number"></div><div><label for="y">y</label><input id="y" type="number"></div></div>
  <div id="f-nick" style="display:none"><label for="nick">玩家暱稱</label><input id="nick" type="text"></div>
  <div id="f-uid" style="display:none"><label for="uid">帳號 ID</label><input id="uid" type="text"></div>
  <label for="amount">金幣數量(1 ~ 1000000)</label>
  <input id="amount" type="number" min="1" value="10">
  <label for="reason">原因(玩家會在信件和事件紀錄看到,最多 60 字)</label>
  <input id="reason" type="text" maxlength="60" placeholder="例如:活動獎勵">
  <button id="send">發送</button> <button id="log" class="alt">看最近紀錄</button>
  <div id="msg"></div>
</div>
<div id="logbox" class="box" style="display:none"></div>
<h1 style="margin-top:24px">全服發信</h1>
<div class="box"><input id="bcsub" type="text" maxlength="40" placeholder="主旨(預設:全服公告)" style="width:100%"><br><textarea id="bctext" rows="4" maxlength="1000" style="width:100%" placeholder="信件內容(最多 1000 字)。會以「系統」寄信給所有玩家的收件箱。"></textarea><br>
<button id="bcsend">寄給所有玩家</button> <button id="bcload" class="alt">看寄過的信</button> <span id="bcmsg"></span><div id="bclist"></div></div>
<h1 style="margin-top:24px">武將修正</h1>
<div class="box"><p style="color:var(--mut);margin-top:0">玩家用上面「找玩家」的欄位。只會降等、不會升等;先按「試算」看結果,確認再按「確認執行」。</p>
<label for="hlv">降到幾級</label><input id="hlv" type="number" min="1" max="20" value="8" style="width:80px"> <label for="hxp">該級經驗值(預設 0)</label><input id="hxp" type="number" min="0" value="0" style="width:100px"><br>
<button id="hlist" class="alt">看武將</button> <button id="hdry">試算</button> <button id="hgo">確認執行</button> <span id="hmsg"></span><div id="hout"></div></div>
<h1 style="margin-top:24px">玩家意見箱</h1>
<div class="box"><button id="fbload" class="alt" style="margin-top:0">讀取意見</button> <span id="fbmsg"></span><div id="fblist"></div></div>
</main>
<footer id="copyright">© 2026 GORDON(曜榮).&nbsp; All rights reserved.</footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#how').addEventListener('change',e=>{for(const k of['xy','nick','uid'])$('#f-'+k).style.display=e.target.value==k?'':'none'});
async function call(method,body){const r=await fetch('/api/admin/gold',{method,headers:{'x-admin-secret':$('#secret').value,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});let j=null;try{j=await r.json()}catch(e){}return{ok:r.ok&&j&&j.ok,s:r.status,j}}
$('#send').onclick=async()=>{const m=$('#msg');m.className='';m.textContent='送出中…';
  const how=$('#how').value,b={amount:Number($('#amount').value),reason:$('#reason').value};
  if(how=='xy'){b.x=$('#x').value;b.y=$('#y').value}else if(how=='nick')b.nick=$('#nick').value;else b.uid=$('#uid').value;
  if(!confirm('確定要發送 '+b.amount+' 金幣嗎?'))return m.textContent='已取消';
  try{const r=await call('POST',b);m.className=r.ok?'ok':'bad';m.textContent=(r.j&&r.j.msg)||('失敗('+r.s+')')}catch(e){m.className='bad';m.textContent='連線失敗'}};
$('#log').onclick=async()=>{const m=$('#msg'),box=$('#logbox');m.className='';m.textContent='讀取中…';
  try{const r=await call('GET');if(!r.ok){m.className='bad';m.textContent=(r.j&&r.j.msg)||('失敗('+r.s+')');return}m.textContent='';
   box.style.display='';box.innerHTML='<table><tr><th>時間</th><th>玩家</th><th>座標</th><th>金幣</th><th>原因</th></tr>'+r.j.log.slice(0,50).map(e=>`<tr><td>${new Date(e.t).toLocaleString()}</td><td>${esc(e.n||e.uid)}</td><td>${e.x}|${e.y}</td><td>${e.amount}</td><td>${esc(e.reason)}</td></tr>`).join('')+'</table>'}catch(e){m.className='bad';m.textContent='連線失敗'}};

const bcShow=l=>{$('#bclist').innerHTML=l.length?l.map(e=>`<div class="box"><b>${esc(e.s||'')}</b><br>${esc(e.m)}<br><small style="color:var(--mut)">${new Date(e.t).toLocaleString()} · 寄給 ${e.n} 位</small></div>`).join(''):'<p style="color:var(--mut)">目前沒有公告</p>'};
async function bcDo(b){const m=$('#bcmsg');m.className='';m.textContent='處理中…';try{const r=await call('POST',b);if(r.ok){m.className='ok';m.textContent=r.j.msg||'完成';bcShow(r.j.list||[]);if(b.t==='bcsend'){$('#bctext').value='';$('#bcsub').value=''}}else{m.className='bad';m.textContent=(r.j&&r.j.msg)||'失敗('+r.s+')'}}catch(e){m.className='bad';m.textContent='連線失敗'}}
$('#bcsend').onclick=()=>{const v=$('#bctext').value.trim();if(!v){$('#bcmsg').textContent='請輸入內容';return}if(confirm('確定寄給所有玩家?寄出後無法收回。'))bcDo({t:'bcsend',s:$('#bcsub').value,m:v})};
$('#bcload').onclick=()=>bcDo({t:'bclist'});
const CAT={bug:'遊戲錯誤',account:'帳號問題',suggest:'建議',report:'檢舉玩家',other:'其他'};
const fbRow=e=>`<div class="box" data-id="${esc(e.id)}"><span class="tag">${esc(CAT[e.c]||'其他')}</span> <b>${esc(e.s)}</b>${e.r?' <span style="color:var(--ok,#4a4)">✅已回覆</span>':''}<br><small style="color:var(--mut)">${esc(e.n)}${e.x!=null?'('+e.x+'|'+e.y+')':''} · ${new Date(e.t).toLocaleString()}</small><div style="white-space:pre-wrap;margin:6px 0">${esc(e.b)}</div>${e.r?`<div style="white-space:pre-wrap;margin:6px 0;padding:6px;border-left:3px solid var(--mut)"><small style="color:var(--mut)">你的回覆 · ${new Date(e.r.t).toLocaleString()}</small><br>${esc(e.r.b)}</div>`:''}<textarea class="fbrt" rows="2" maxlength="500" placeholder="回覆玩家(會用系統信寄到他的飛鴿傳書)" style="width:100%"></textarea><div class="row" style="align-items:center"><button class="fbreply" style="margin:0">${e.r?'再回覆一次':'回覆'}</button><input class="fbamt" type="number" min="1" value="5" style="max-width:90px"><button class="fbgold" data-u="${esc(e.u)}" style="margin:0">送金幣給 ${esc(e.n)}</button><button class="fbdel alt" style="margin:0;max-width:80px">刪除</button></div></div>`;
function fbShow(list){$('#fblist').innerHTML=list.length?list.map(fbRow).join(''):'<p style="color:var(--mut)">目前沒有意見</p>'}
$('#fbload').onclick=async()=>{const m=$('#fbmsg');m.className='';m.textContent='讀取中…';try{const r=await call('POST',{t:'fblist'});if(!r.ok){m.className='bad';m.textContent=(r.j&&r.j.msg)||('失敗('+r.s+')');return}m.textContent='';fbShow(r.j.list)}catch(e){m.className='bad';m.textContent='連線失敗'}};
$('#fblist').addEventListener('click',async ev=>{const t=ev.target,box=t.closest('[data-id]');if(!box)return;const m=$('#fbmsg');
 if(t.classList.contains('fbreply')){const tx=box.querySelector('.fbrt').value.trim();if(!tx){m.className='bad';m.textContent='請先寫回覆內容';return}t.disabled=true;const r=await call('POST',{t:'fbreply',id:box.dataset.id,text:tx});t.disabled=false;if(r.ok){m.className='';m.textContent=r.j.msg;fbShow(r.j.list)}else{m.className='bad';m.textContent=(r.j&&r.j.msg)||'失敗'}return}
 if(t.classList.contains('fbdel')){if(!confirm('刪除這則意見?'))return;const r=await call('POST',{t:'fbdel',id:box.dataset.id});if(r.ok)fbShow(r.j.list);else{m.className='bad';m.textContent=(r.j&&r.j.msg)||'失敗'}}
 else if(t.classList.contains('fbgold')){const amt=Number(box.querySelector('.fbamt').value);if(!confirm('確定送 '+amt+' 金幣給這位玩家嗎?'))return;const r=await call('POST',{uid:t.dataset.u,amount:amt,reason:'意見回饋'});m.className=r.ok?'ok':'bad';m.textContent=(r.j&&r.j.msg)||('失敗('+r.s+')')}});
function whoBody(){const how=$('#how').value,b={};if(how=='xy'){b.x=$('#x').value;b.y=$('#y').value}else if(how=='nick')b.nick=$('#nick').value;else b.uid=$('#uid').value;return b}
const hv=h=>h?`${esc(h.n)} Lv${h.lv} 經驗${h.xp} 剩餘點${h.pts} (攻${h.a}/防${h.d}/速${h.s}/載${h.c})`:'(沒有武將)';
async function hero(t,confirmIt){const m=$('#hmsg');m.className='';m.textContent='處理中…';const b={...whoBody(),t};if(t=='herofix'){b.level=Number($('#hlv').value);b.xp=Number($('#hxp').value)||0;b.confirm=confirmIt;if(confirmIt&&!confirm('確定把這位玩家的武將降到 '+b.level+' 級嗎?'))return m.textContent='已取消'}
  try{const r=await call('POST',b);if(!r.ok){m.className='err';m.textContent=(r.j&&r.j.msg)||('失敗('+r.s+')');return}
  m.textContent=r.j.msg;$('#hout').innerHTML=r.j.rows.map(x=>`<p><b>${esc(x.key)} ${esc(x.cname||'')}</b><br>現在:${hv(x.before)}`+(x.changed?`<br>改成:${hv(x.after)}${x.reset?'(屬性點全部退回)':''}${x.written?' ✅已寫入':x.err?' ⚠'+esc(x.err):''}`:'<br>不用改')+'</p>').join('')}catch(e){m.className='err';m.textContent='連線失敗'}}
$('#hlist').onclick=()=>hero('herolist');$('#hdry').onclick=()=>hero('herofix',false);$('#hgo').onclick=()=>hero('herofix',true);
</script>
</body>
</html>
